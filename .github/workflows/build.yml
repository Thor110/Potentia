# Builds and tests Sieve on Windows, Linux and macOS on every push and pull request.
#
# GitHub only runs workflows from the repository root's .github/workflows folder, so this file is
# there (moved from Sieve/.github on 21 October 2026), and every step runs in the project's folder,
# PROJECT_DIR below.
name: build

on: [push, pull_request]

env:
  PROJECT_DIR: Sieve

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
    steps:
      - uses: actions/checkout@v4

      # The reference oracle: the same Python on every platform, as `python`.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # SDL (the hallway's window) needs X11's development files to configure on Linux; GitHub's
      # Ubuntu does not have them. The hallway's checks then run with no display (offscreen).
      - name: Linux packages for SDL
        if: runner.os == 'Linux'
        run: |
          trap 'echo "::error::the step stopped at its line $LINENO: $BASH_COMMAND" >&2' ERR # names the failing line
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev \
            libxss-dev libxtst-dev libxkbcommon-dev libgl1-mesa-dev libegl1-mesa-dev libasound2-dev libpulse-dev \
            libudev-dev libdbus-1-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit and conformance tests
        run: bash ci/steps/01-unit-tests.sh

      - name: Same addresses on every platform
        run: bash ci/steps/02-same-addresses.sh

      - name: Filters judge, count and rank the same on every platform
        run: bash ci/steps/03-filters.sh

      - name: A model is one object with an address on two lines
        env:
          # The hallway's checks here need no screen, as in the hallway's own step. On a Mac, SDL's
          # offscreen driver still asks for OpenGL, which a runner has not got; its dummy driver
          # draws in memory as well (nothing here compares pictures).
          SDL_VIDEO_DRIVER: ${{ runner.os == 'macOS' && 'dummy' || 'offscreen' }}
          SDL_RENDER_DRIVER: software
        run: bash ci/steps/04-models.sh

      - name: BigUint's arithmetic also builds and passes without a 128-bit integer type
        if: runner.os == 'Linux'
        run: bash ci/steps/05-biguint-portable.sh

      - name: A file is one unit of the bytes256 line, and its address is its own bytes
        run: bash ci/steps/06-bytes256.sh

      - name: Sound itself is a set of the audio line, and comes back as the same WAV
        run: bash ci/steps/07-sound.sh

      - name: Other picture and video formats come in through ffmpeg
        run: bash ci/steps/08-ffmpeg.sh

      - name: Books bind, unbind and keep their id in every ordering
        run: bash ci/steps/09-books.sh

      - name: Hallway renders, and its doors keep the corridor position (Linux, no display)
        if: runner.os == 'Linux'
        env:
          SDL_VIDEO_DRIVER: offscreen
          SDL_RENDER_DRIVER: software
        run: bash ci/steps/10-hallway.sh

      - name: Reference oracle reproduces the committed vectors
        run: bash ci/steps/11-oracle.sh

      - name: The pinned model rebuilds byte for byte from its corpus (Linux)
        if: runner.os == 'Linux'
        run: bash ci/steps/12-pinned-model.sh
