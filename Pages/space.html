<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Potentia // OLAP Simulation</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:#0a0a0f;
    color:#e0ddd8;
    font-family:'Courier New',monospace;
    font-size: 16px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:32px;
  }
  h1{font-size:16px;letter-spacing:0.3em;text-transform:uppercase;color:#666;margin-bottom:12px;text-align:center;white-space:nowrap;}
  .sub{font-size:16px;color:#444;margin-bottom:24px;letter-spacing:0.15em;text-align:center;max-width:2000px;line-height:1.6;}
  
  .box {
    width: 100%;
    max-width: 800px;
    border: 1px solid #2a2a3a;
    background: #0d0d14;
    padding: 24px;
    margin-bottom: 24px;
    position: relative;
  }
  
  /* Simulation Viewport Container */
  .sim-viewport {
    width: 100%;
    height: 400px;
    background: #050508;
    border: 1px solid #2a2a3a;
    margin-bottom: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #444;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    position: relative;
    overflow: hidden;
  }

  .sim-overlay-text {
    font-size: 14px;
    color: #666;
    margin-top: 8px;
    text-align: center;
  }

  .control-group {
    display: flex;
    flex-direction: column;
    gap: 16px;
    width: 100%;
    transition: all 0.3s ease;
  }

  .slider-label {
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: #888;
    text-align: center;
  }

  /* Custom Input Slider */
  input[type=range] {
    -webkit-appearance: none;
    width: 100%;
    background: transparent;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    height: 16px;
    width: 16px;
    background: #888;
    cursor: pointer;
    margin-top: -6px;
    border-radius: 0;
  }
  input[type=range]::-webkit-slider-runnable-track {
    width: 100%;
    height: 4px;
    cursor: pointer;
    background: #2a2a3a;
  }
  input[type=range]:focus {
    outline: none;
  }

  /* Base Action Button Styles */
  .btn-action {
    display: block;
    width: 100%;
    background: transparent;
    border: 1px solid #2a2a3a;
    color: #888;
    padding: 16px 20px;
    font-family: 'Courier New',monospace;
    font-size: 16px;
    letter-spacing: 0.15em;
    cursor: pointer;
    text-transform: uppercase;
    text-align: center;
    transition: all 0.15s;
  }
  .btn-action:hover {
    border-color: #555;
    color: #ccc;
    background: #111;
  }

  /* Specific Fullscreen Toggle Overlay Override */
  .btn-action.fs-toggle {
    position: absolute;
    top: 16px;
    right: 16px;
    width: auto;
    display: inline-block;
    padding: 8px 14px;
    font-size: 12px;
    letter-spacing: 0.1em;
    background: rgba(13, 13, 20, 0.85);
    z-index: 100;
  }
  .btn-action.fs-toggle:hover {
    background: rgba(25, 25, 35, 0.95);
  }
  
  /* Warning state for reset confirmation */
  .btn-action.warning {
    color: #a35d5d;
    border-color: #a35d5d;
  }
  .btn-action.warning:hover {
    background: #2a1515;
  }

  /* HUD Morphing for Fullscreen State */
  #sim-container:fullscreen {
    background: #050508;
    border: none;
    padding: 0;
    max-width: 100%;
  }
  #sim-container:fullscreen .sim-viewport {
    height: 100vh;
    margin: 0;
    border: none;
  }
  #sim-container:fullscreen .control-group {
    position: absolute;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    width: calc(100% - 64px);
    max-width: 800px;
    background: rgba(13, 13, 20, 0.9);
    padding: 24px;
    border: 1px solid #2a2a3a;
    z-index: 20;
  }

  .nav-group {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
    max-width: 800px;
  }

  .btn-link {
    display: block;
    text-decoration: none;
    background: transparent;
    border: 1px solid #2a2a3a;
    color: #888;
    padding: 14px 20px;
    font-family: 'Courier New',monospace;
    font-size: 16px;
    letter-spacing: 0.15em;
    cursor: pointer;
    text-transform: uppercase;
    text-align: center;
    transition: all 0.15s;
  }
  .btn-link:hover {
    border-color: #555;
    color: #ccc;
    background: #111;
  }

  .footer {
    margin-top: 32px;
    font-size: 16px;
    color: #222;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    text-align: center;
  }
</style>
</head>
<body>

<h1>Potentia // OLAP Sandbox</h1>
<div class="sub">
  Planetary Departure & Trajectory Simulation (v0.1)
</div>

<div class="box" id="sim-container">
  <div class="sim-viewport" id="viewport">
    <button id="fs-btn" class="btn-action fs-toggle">[ ] Fullscreen</button>
    <div id="viewport-status">[ PLANETARY DISPLAY ACTIVE ]</div>
    <div class="sim-overlay-text" id="viewport-sub">Awaiting Departure Vector...</div>
  </div>

  <div class="control-group">
    <div class="slider-label" id="slider-readout">Timeline / Speed Scrub: 0.0x</div>
    <input type="range" id="time-slider" min="-100" max="100" value="0">
    <button id="main-btn" class="btn-action">Engage Simulation</button>
  </div>
</div>

<div class="nav-group">
  <a href="../index.html" class="btn-link">Return to Core Architecture</a>
</div>

<div class="footer">
  Deterministic Sieve · Civilisational Backup v1.0
</div>

<script>
  const mainBtn = document.getElementById('main-btn');
  const slider = document.getElementById('time-slider');
  const readout = document.getElementById('slider-readout');
  const viewportStatus = document.getElementById('viewport-status');
  const viewportSub = document.getElementById('viewport-sub');

  let simState = 'READY'; // States: READY, RUNNING, CONFIRM_RESET

  // Handle Timeline Slider Updates
  slider.addEventListener('input', (e) => {
    const val = e.target.value;
    readout.innerText = `Timeline / Speed Scrub: ${val > 0 ? '+' : ''}${val}.0x`;
    
    if (simState === 'RUNNING') {
      viewportSub.innerText = `Calculating vector shifts at ${val}x speed...`;
    }
  });

  // Handle Multi-State Core Button
  mainBtn.addEventListener('click', () => {
    if (simState === 'READY') {
      simState = 'RUNNING';
      mainBtn.innerText = 'Reset Simulation';
      viewportStatus.innerText = '[ GALACTIC DISPLAY ACTIVE ]';
      viewportStatus.style.color = '#888';
      viewportSub.innerText = `Executing departure sequence...`;
      
    } else if (simState === 'RUNNING') {
      simState = 'CONFIRM_RESET';
      mainBtn.innerText = 'Are you sure? (Click to Confirm)';
      mainBtn.classList.add('warning');
      
    } else if (simState === 'CONFIRM_RESET') {
      simState = 'READY';
      mainBtn.innerText = 'Engage Simulation';
      mainBtn.classList.remove('warning');
      slider.value = 0;
      readout.innerText = `Timeline / Speed Scrub: 0.0x`;
      viewportStatus.innerText = '[ PLANETARY DISPLAY ACTIVE ]';
      viewportStatus.style.color = '#444';
      viewportSub.innerText = `Awaiting Departure Vector...`;
    }
  });

  // Fullscreen Handler
  const fsBtn = document.getElementById('fs-btn');
  const simContainer = document.getElementById('sim-container');

  fsBtn.addEventListener('click', () => {
    if (!document.fullscreenElement) {
      simContainer.requestFullscreen().catch(err => {
        console.error(`Fullscreen rendering failed: ${err.message}`);
      });
    } else {
      document.exitFullscreen();
    }
  });

  document.addEventListener('fullscreenchange', () => {
    if (document.fullscreenElement) {
      fsBtn.innerText = '[X] Exit Fullscreen';
    } else {
      fsBtn.innerText = '[ ] Fullscreen';
    }
  });
</script>

</body>
</html>
