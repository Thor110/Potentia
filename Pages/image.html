<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Potentia // Image Archive</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:#0a0a0f;
    color:#e0ddd8;
    font-family:'Courier New',monospace;
    font-size: 16px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content: center;
    padding:32px;
  }
  h1{font-size:16px;letter-spacing:0.3em;text-transform:uppercase;color:#666;margin-bottom:12px;text-align:center;white-space:nowrap;}
  .sub{font-size:16px;color:#444;margin-bottom:20px;letter-spacing:0.15em;text-align:center;max-width:2000px;line-height:1.6;}
  
  /* Manifesto block lines with wider max-width to prevent premature wrapping */
  .manifesto-line {
    font-size: 16px;
    color: #666;
    margin-bottom: 16px;
    letter-spacing: 0.1em;
    text-align: center;
    max-width: 2000px;
    line-height: 1.5;
  }
  
  /* Counter block matching the mechanical aesthetic */
  .counter-box {
    width: 100%;
    max-width: 600px;
    border: 1px solid #2a2a3a;
    background: #0d0d14;
    padding: 20px;
    margin-bottom: 24px;
    text-align: center;
  }
  .counter-title {
    font-size: 16px;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    color: #666;
    margin-bottom: 8px;
    white-space: nowrap;
  }
  .counter-value {
    font-size: 16px;
    color: #e0ddd8;
    letter-spacing: 0.1em;
    font-weight: bold;
    white-space: nowrap;
  }

  .section-label {
    font-size: 16px;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    color: #444;
    margin-bottom: 16px;
    text-align: center;
    white-space: nowrap;
  }

  .nav-group {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
    max-width: 600px;
    margin-bottom: 24px;
  }

  /* Matching the viewfinder button style exactly */
  .btn-link {
    display: block;
    text-decoration: none;
    background: transparent;
    border: 1px solid #2a2a3a;
    color: #888;
    padding: 14px 20px;
    font-family: 'Courier New',monospace;
    font-size: 16px;
    letter-spacing: 0.15em;
    cursor: pointer;
    text-transform: uppercase;
    text-align: center;
    white-space: nowrap;
    transition: all 0.15s;
  }

  .btn-link:hover {
    border-color: #555;
    color: #ccc;
    background: #111;
  }

  .footer {
    margin-top: 16px;
    font-size: 16px;
    color: #222;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    text-align: center;
    white-space: nowrap;
  }
</style>
</head>
<body>

<h1>Potentia // Image Archive</h1>
<div class="sub">
  Infinite procedural generation pipelines.
</div>

<div class="nav-group">
  <a href="../index.html" class="btn-link">Return to Core Architecture</a>
</div>

<div class="footer">
  Deterministic Sieve · Gallery of Babel v1.0
</div>
</body>
</html>
