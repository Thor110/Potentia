# Builds and tests Sieve on Windows, Linux and macOS on every push and pull request.
#
# GitHub only runs workflows from the repository root's .github/workflows folder. If this project
# lives in a subfolder of the repository (for example Potentia/Sieve), move this file to
# <repository root>/.github/workflows/build.yml and set PROJECT_DIR below to that subfolder.
name: build

on: [push, pull_request]

env:
  PROJECT_DIR: Sieve

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit and conformance tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Same addresses on every platform
        run: |
          exe=build/sieve
          [ -f build/Release/sieve.exe ] && exe=build/Release/sieve.exe
          $exe version
          got=$($exe warp --length 32 --mode scrambled "It was the best of times" | awk '/scrambled/ {print $2}')
          echo "scrambled address: $got"
          test "$got" = "007b30165818bf0311497600aa52996f9395e27"
          test "$($exe read --length 32 --mode scrambled "$got" | sed 's/ *$//')" = "it was the best of times"
          $exe dicts
          ! $exe dicts | grep -q "MISMATCH\|MISSING"
          $exe sift --lengths 1-8 --brute-max 4 --pruned-max 5 > /dev/null

      - name: Hallway renders and its doors round-trip (Linux, no display)
        if: runner.os == 'Linux'
        env:
          SDL_VIDEO_DRIVER: offscreen
          SDL_RENDER_DRIVER: software
        run: |
          build/hallway --screenshot hallway.png --size 640x360
          test -s hallway.png
          out=$(build/hallway --pose 0,7,-90,0 --walk "-2.3,0;2.5,0" --screenshot door.png)
          echo "$out"
          echo "$out" | grep -q "through the door into the IMAGE line"
          echo "$out" | grep -q "back in the TEXT line"

      - name: Reference oracle reproduces the committed vectors
        run: |
          cd reference
          python3 sieve_ref.py vectors       | diff - ../tests/vectors_v1.tsv
          python3 sieve_ref.py digit-vectors | diff - ../tests/vectors_digits_v1.tsv
          python3 sieve_ref.py canon-vectors | diff - ../tests/vectors_canon.tsv
          python3 sieve_ref.py image-vectors | diff - ../tests/vectors_image_v1.tsv
