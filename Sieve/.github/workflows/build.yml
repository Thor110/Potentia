          $H --line image --edge-glow --walk "0,0" --screenshot noportal.png 2>&1 | q "door portals off"
          test -s portal.png && test -s noportal.png
          $H --main-menu --press "Down,Return,Return,Return" --screenshot main-res.png | q "saved"
          # Settings, Graphics, then VSync off, Geometry Edge Glow on, Real Graphics on — which
          # turns the glow back off, the two being mutually exclusive. From a settings file that
          # does not exist yet, so the toggles start from their defaults whatever ran before.
          rm -f app.ini
          $H --main-menu --settings app.ini --press "Down,Return,Return,Down,Down,Return,Down,Return,Down,Return" --screenshot main-gfx.png > /dev/null
          grep -q "^vsync = off" app.ini
          grep -q "^edge_glow = off" app.ini
          grep -q "^real_graphics = on" app.ini
          grep -q "^door_portals = on" app.ini   # Real Graphics brings Door Portals with it
          mkdir -p lt/data/lang && cp data/lang/en.txt lt/data/lang/ && printf 'language.name = Test\nitem.start = START TEST\n' > lt/data/lang/tt.txt
          (cd lt && ../$H --main-menu --language tt --screenshot ../main-tt.png) | q "main menu: language tt, font sieve8x8"
          # The language's font: sieve8x8 draws accented and Greek letters; a missing font is reported.
          mkdir -p lt/data/fonts && cp data/fonts/sieve8x8.hex lt/data/fonts/
          printf 'font = sieve8x8\nlanguage.name = Fran\xc3\xa7ais\nitem.start = D\xc3\xa9marrer Sieve\n' > lt/data/lang/fr.txt
          out=$(cd lt && ../$H --main-menu --language fr --screenshot ../main-fr.png 2>&1)
          echo "$out" | q "main menu: language fr, font sieve8x8"
          if echo "$out" | grep -c "not found" > /dev/null; then exit 1; fi
          printf 'font = nosuchfont\nitem.start = X\n' > lt/data/lang/xx.txt
          out=$(cd lt && ../$H --main-menu --language xx --screenshot ../main-xx.png 2>&1)
          echo "$out" | q "font 'nosuchfont' not found"
          echo "$out" | q "main menu: language xx, font sieve8x8"
          # Filter modes: compact shelves only survivors (warped text lands on a shelf, not in hand),
          # an unrankable stack falls back to hide, and the filter overlay renders.
          printf '[text]\nmode = compact\nfilters = words-v2\n' > words2.ini
          printf '[text]\nmode = compact\nfilters = words-v2, max-run-v1\n' > mixed.ini
          printf '[text]\nmode = mark\nfilters = words-v1\n' > mark.ini
          printf '[audio]\nmode = compact\nfilters = key-v1\n[audio.key-v1]\ntonic = A\nscale = minor-pentatonic\n[image]\nmode = compact\nfilters = symbol-entropy-v1\n[image.symbol-entropy-v1]\nmax_millibits = 500\n' > lines.ini
          out=$($H --filters words2.ini --warp "$W" --walk "0,0" --screenshot compact.png)
          echo "$out"
          echo "$out" | q "filters: 1 compact (303766...7712 (28 digits) survivors), tile 119770...5023 (26 digits)"
          $H --filters mixed.ini --walk "0,0" --screenshot mixed.png | q "filters: 2 hide (compact: words-v2 can rank, but not together with max-run-v1)"
          $H --filters mark.ini --length 3 --walk "0,0" --screenshot mark.png | q "filters: 1 mark"
          $H --menu --filters words2.ini --press "F" --screenshot overlay.png | q "saved overlay.png"
          # Compact in the scrambled and guided orderings, and on the image and audio lines.
          $H --filters words2.ini --mode scrambled --warp "$W" --walk "0,0" --screenshot cs.png | sed -n 1p | q "PAGES line, scrambled, filters: 1 compact"
          $H --filters words2.ini --mode guided --warp "$W" --walk "0,0" --screenshot cg.png | sed -n 1p | q "PAGES line, guided zoom 59, filters: 1 compact"
          $H --filters lines.ini --line image --mode scrambled --walk "0,0" --screenshot ci.png | sed -n 1p | q "IMAGE line, scrambled, filters: 1 compact (322091425582872 survivors)"
          $H --filters lines.ini --line audio --walk "0,0" --screenshot ca.png | sed -n 1p | q "AUDIO line, positional, filters: 1 compact"
          # A notes2 audio line of two voices, its plugins judging each voice, in compact order.
          printf '[audio]\nmode = compact\nfilters = key-data-v2, melody-leap-v1\n[audio.key-data-v2]\ntonic = D\n[audio.melody-leap-v1]\nleap = 2\n' > n2h.ini
          $H --filters n2h.ini --line audio --note-set notes2 --voices 2 --notes 3 --walk "0,0" --screenshot n2a.png | sed -n 1p | q "AUDIO line, positional, filters: 2 compact (47572844544 survivors)"
          # One line filtered by another. The CLI's counts are the oracle's (the vector files'
          # rows): not-written-v1 on 32-letter pages, alone and with max-run-data-v1; binary-kind-v1
          # on a 33-byte binary line. The kinds a file says it is, from locate and check.
          printf "[text]\nmode = compact\nfilters = not-written-v1\n" > nw.ini
          want=$(awk -F'\t' '$1 == "count" && $2 == "lower27" && $3 == "all" && $4 == "32" && NF == 5 {print $5}' tests/vectors_written_v1.tsv)
          build/sieve filters --length 32 --filters nw.ini | q "^survivors    $want (exact; compact mode available)"
          build/sieve filters --length 32 --filters nw.ini | q "^share        the stack keeps about all of the line and sets aside 10\^-4.23"
          printf "[text]\nmode = compact\nfilters = not-written-v1, max-run-data-v1\n[text.max-run-data-v1]\nmax = 2\n" > nw2.ini
          want=$(awk -F'\t' '$1 == "count" && $6 == "max-run-data-v1" && $7 == "max=2" {print $5}' tests/vectors_written_v1.tsv)
          build/sieve filters --length 16 --filters nw2.ini | q "^survivors    $want (exact; compact mode available)"
          build/sieve check --length 32 --filters nw.ini "enfk" | q "stack: fails at not-written-v1"
          build/sieve check --length 32 --filters nw.ini "hello world" | q "stack: passes, survivor number"
          printf "[binary]\nmode = compact\nfilters = binary-kind-v1\n[binary.binary-kind-v1]\nkinds = png\n" > bk.ini
          want=$(awk -F'\t' '$1 == "count" && $2 == "33" && $3 == "png" && $4 == "keep" {print $5}' tests/vectors_kinds_v1.tsv)
          build/sieve filters --line binary --length 33 --filters bk.ini | q "^survivors    $want (exact; compact mode available)"
          build/sieve filters --line binary --length 32 | q "^  TXT  *10\^-0.87"
          printf 'MThd\0\0\0\6' > k.mid
          build/sieve locate k.mid | q "^kind      MID (file-kinds-v1, from its first bytes)"
          build/sieve check --line binary --file k.mid --filters bk.ini | q "stack: fails at binary-kind-v1"
          # In the hallway: the binary line compacted to PNGs, every file on the shelves a PNG; J
          # from a page to its file on the binary line and back; and from a picture, a PNG.
          $H --no-menu --line binary --filters bk.ini --walk "0,0" --screenshot binpng.png | sed -n 1p | q "^BINARY line, positional, filters: 1 compact .* PNG 32 bytes: 89 50 4e 47"
          $H --no-menu --warp "hello world" --press "J" --screenshot j1.png | q "^BINARY line.*its file: TXT, 32 bytes, on the binary line"
          $H --no-menu --warp "hello world" --press "J,J" --screenshot j2.png | q "^PAGES line.*a TXT file, opened on the PAGES line"
          $H --no-menu --line image --walk "0,0" --press "E,J,J" --screenshot j3.png | q "^IMAGE line.*a PNG file, opened on the IMAGE line"
          $H --no-menu --line audio --warp "C4q E4q G4h Re B4e C5w" --press "J,J" --screenshot j4.png | q "^AUDIO line.*a MID file, opened on the AUDIO line"
          # Every line filtered by every other (FILTER-PLUGINS.md section 16): the CLI's counts are
          # the oracle's cross-vectors; a page's file fails not-an-item-v1 on the binary line, and
          # the hallway says why the binary line cannot compact with every item form asked for.
          printf "[text]\nmode = compact\nfilters = not-a-file-v1\n" > naf.ini
          want=$(awk -F'\t' '$1 == "not-a-file" && $2 == "27" && $3 == "32" {print $4}' tests/vectors_cross_v1.tsv)
          build/sieve filters --length 32 --filters naf.ini | q "^survivors    $want (exact; compact mode available)"
          printf "[image]\nmode = compact\nfilters = not-packed-v1\n" > np.ini
          want=$(awk -F'\t' '$1 == "packed" && $2 == "2" && $3 == "100" {print $4}' tests/vectors_cross_v1.tsv)
          build/sieve filters --line image --filters np.ini | q "^survivors    $want (exact; compact mode available)"
          printf "[binary]\nmode = compact\nfilters = binary-kind-v1, not-an-item-v1\n[binary.binary-kind-v1]\nkinds = signed\nkeep = exclude\n" > ni.ini
          want=$(awk -F'\t' '$1 == "item-pages" && $2 == "40" {print $7}' tests/vectors_cross_v1.tsv)
          build/sieve filters --line binary --length 40 --alphabet ascii95 --page-length 20 --filters ni.ini | q "^survivors    $want (exact; compact mode available)"
          printf 'hello world, 20 char' > page.txt
          build/sieve check --line binary --length 40 --alphabet ascii95 --page-length 20 --file page.txt --filters ni.ini | q "stack: fails at not-an-item-v1"
          # The models line's own stack: not-a-file-v1 on a model's number, counted as the oracle
          # counts it, a cube's verdict and compact address, and the line compacted in the hallway.
          printf "[models]\nmode = compact\nfilters = not-a-file-v1\n" > mf.ini
          want=$(awk -F'\t' '$1 == "models" && $2 == "8" && $3 == "12" && $4 == "16" {print $5}' tests/vectors_cross_v1.tsv)
          build/sieve filters --line models --filters mf.ini | q "^survivors    $want (exact; compact mode available)"
          build/sieve mesh --warp cube.obj --filters mf.ini | q "^stack: passes, survivor number"
          $H --no-menu --line models --filters mf.ini --walk "0,0" --screenshot mcompact.png | q "^MODELS line, positional, filters: 1 compact"
          # And the line's own filters: counted as the oracle's face walk counts them, a cube passes
          # all three, and the hallway's compact line holds only well-formed models.
          printf "[models]\nmode = compact\nfilters = distinct-vertices-v1, distinct-indices-v1, every-vertex-used-v1\n" > mr.ini
          want=$(awk -F'\t' '$1 == "mesh" && $2 == "8" && $3 == "12" && $4 == "16" && $5 == "viu" {print $6}' tests/vectors_cross_v1.tsv)
          build/sieve filters --line models --filters mr.ini | q "^survivors    $want (exact; compact mode available)"
          build/sieve mesh --warp cube.obj --filters mr.ini | q "^stack: passes, survivor number"
          $H --no-menu --line models --filters mr.ini --walk "0,0" --take --screenshot mrules.png | q "8/8 vertices used, 0 degenerate faces"
          # not-a-pattern-v1: counted as the oracle counts it (by inclusion and exclusion over the
          # block lengths), and a ramp through the alphabet fails while text passes.
          printf "[text]\nmode = compact\nfilters = not-a-pattern-v1\n" > pat.ini
          want=$(awk -F'\t' '$1 == "pattern" && $2 == "27" && $3 == "32" && $4 == "1" {print $8}' tests/vectors_cross_v1.tsv)
          build/sieve filters --length 32 --filters pat.ini | q "^survivors    $want (exact; compact mode available)"
          build/sieve check --length 26 --filters pat.ini --model none "abcdefghijklmnopqrstuvwxyz" | q "stack: fails at not-a-pattern-v1"
          build/sieve check --length 26 --filters pat.ini --model none "it was the best of times it" | q "stack: passes"
          printf "[binary]\nmode = compact\nfilters = not-an-item-v1\n[binary.not-an-item-v1]\nitems = all\n" > nia.ini
          $H --no-menu --line binary --filters nia.ini --walk "0,0" --screenshot nia.png | q "^BINARY line, positional, filters: 1 hide (compact: not-an-item-v1 judges models file by file"
          test -s compact.png && test -s mixed.png && test -s mark.png && test -s overlay.png

      - name: Reference oracle reproduces the committed vectors
        run: |
          cd reference
          python sieve_ref.py vectors       | diff - ../tests/vectors_v1.tsv
          python sieve_ref.py biguint-vectors | diff - ../tests/vectors_biguint_v1.tsv
          python sieve_ref.py biguint-large-vectors | diff - ../tests/vectors_biguint_large_v1.tsv
          python sieve_ref.py digit-vectors | diff - ../tests/vectors_digits_v1.tsv
          python sieve_ref.py canon-vectors | diff - ../tests/vectors_canon.tsv
          python sieve_ref.py bytes-vectors | diff - ../tests/vectors_bytes_v1.tsv
          python sieve_ref.py alphabet-vectors | diff - ../tests/vectors_alphabets_v1.tsv
          python sieve_ref.py model-vectors | diff - ../tests/vectors_models_v1.tsv
          python sieve_ref.py image-vectors | diff - ../tests/vectors_image_v1.tsv
          python sieve_ref.py guided-vectors | diff - ../tests/vectors_guided_v1.tsv
          python sieve_ref.py filter-vectors | diff - ../tests/vectors_filters_v1.tsv
          python sieve_ref.py compact-vectors | diff - ../tests/vectors_compact_v1.tsv
          python sieve_ref.py book-vectors | diff - ../tests/vectors_books_v1.tsv
          python sieve_ref.py titled-vectors | diff - ../tests/vectors_titled_v1.tsv
          python sieve_ref.py binary-vectors | diff - ../tests/vectors_binary_v1.tsv
          python sieve_ref.py chunk-vectors | diff - ../tests/vectors_chunks_v1.tsv
          python sieve_ref.py notes2-vectors | diff - ../tests/vectors_notes2_v1.tsv
          # One line filtered by another (FILTER-PLUGINS.md section 15): file kinds and the binary
          # line's filter by them, and not-written-v1, counted by the oracle's own machines, its
          # closed form for the binary reading and the overlap walked pair by pair (about 3 minutes).
          python sieve_ref.py kind-vectors | diff - ../tests/vectors_kinds_v1.tsv
          python sieve_ref.py written-vectors | diff - ../tests/vectors_written_v1.tsv
          # Every line filtered by every other (section 16): not-a-file, the notation and .obj
          # machines, the packed closed form and the pages among the binary kinds; and the models
          # line's rules with canonical-mesh-v1 (about 45 s).
          python sieve_ref.py cross-vectors | diff - ../tests/vectors_cross_v1.tsv
          # palette-size-v1 and row-runs-v1 (closed forms, brute force on small lines), and
          # utf8-valid-v1 on the binary line (code points by encoded length, Python's decoder).
          python sieve_ref.py picture-vectors | diff - ../tests/vectors_picture_v1.tsv
          python sieve_ref.py utf8-vectors | diff - ../tests/vectors_utf8_v1.tsv
          # The generated text plugins are what tools/build_text_plugins.py makes from the pinned lists.
          python ../tools/build_text_plugins.py --check
          python sieve_ref.py book-filter-vectors | diff - ../tests/vectors_book_filters_v1.tsv
          python sieve_ref.py book-read ../tests/example_book_v1.book > book.out
          test "$(head -1 book.out)" = "$(awk '$1 == "id" {print $2}' ../tests/example_book_v1.book)"
          tail -n +3 book.out | cmp - ../tests/example_book_v1.pages.txt
          # The file locator and the manifest creator: the tool's manifest of the fixture folder is
          # the oracle's to the byte, and every file's address it writes is binary-v1's.
          S=../build/sieve
          [ -f ../build/Release/sieve.exe ] && S=../build/Release/sieve.exe
          # Filter plugins (docs/FILTER-PLUGINS.md): every reference plugin, at several lengths and
          # settings, reported identically by the engine and by the oracle's own parser and engine
          # (states declared and minimal, survivors, excluded, and survivors by rank).
          for L in 1 2 5 17 40; do
            for spec in "clean-data-v1:" "clean-data-v2:" "max-run-data-v1:max=1" "max-run-data-v1:max=3" "max-run-data-v1:max=5" "key-data-v1:tonic=0" "key-data-v1:tonic=5" "key-data-v1:tonic=11" "tidy-data-v1:" "tidy-data-v1:longest=3"; do
              f=${spec%%:*}; p=${spec#*:}
              python sieve_ref.py plugin ../data/filters/$f.sfilter --length $L ${p:+--params $p} > plugin.oracle
              $S filters --plugin ../data/filters/$f.sfilter --length $L ${p:+--params $p} | tr -d '\r' > plugin.engine
              diff plugin.oracle plugin.engine
            done
          done
          # The token form: the ports of words-v1 and window-v1 (a dictionary each, built another way
          # by the oracle: an NFA and the subset construction, then Hopcroft), and a toy grammar
          # (word lists, follow, first and last, a word in two sets; whole and cut edges).
          for f in words-data-v1 window-data-v1; do
            python sieve_ref.py plugin ../data/filters/$f.sfilter --length 6 --params dictionary=scowl-en-35 > plugin.oracle
            $S filters --plugin ../data/filters/$f.sfilter --length 6 --params dictionary=scowl-en-35 | tr -d '\r' > plugin.engine
            diff plugin.oracle plugin.engine
          done
          # toy-tags: tagged lists (two files as one, an excluded tag, capitals folded, lines skipped).
          for f in toy-grammar-v1 toy-grammar-cut-v1 toy-tags-v1 toy-tags-cut-v1; do
            for L in 1 3 11 25; do
              python sieve_ref.py plugin ../tests/plugins/$f.sfilter --length $L > plugin.oracle
              $S filters --plugin ../tests/plugins/$f.sfilter --length $L | tr -d '\r' > plugin.engine
              diff plugin.oracle plugin.engine
            done
          done
          # sieve-filter-v2 (comparisons, && || !, min max abs, if/else/fi, choice parameters, the
          # line's constants, symbols families): the melody plugins on the audio line at several
          # settings, and a toy of the grammar on the text line.
          for spec in "key-data-v2:" "key-data-v2:tonic=A,scale=minor" "key-data-v2:tonic=F#,scale=blues" "melody-leap-v1:" "melody-leap-v1:leap=2,rest_resets=yes" "melody-lengths-v1:" "melody-lengths-v1:shortest=q,longest=h,eighths=0" "melody-rests-v1:" "melody-rests-v1:run=1,total=3,leading=yes" "melody-ending-v1:tonic=A,hold=h" "melody-range-v1:low=64,high=72"; do
            f=${spec%%:*}; p=${spec#*:}
            for L in 1 2 5 17; do
              python sieve_ref.py plugin ../data/filters/$f.sfilter --length $L ${p:+--params $p} > plugin.oracle
              $S filters --plugin ../data/filters/$f.sfilter --length $L ${p:+--params $p} | tr -d '\r' > plugin.engine
              diff plugin.oracle plugin.engine
            done
          done
          for spec in "melody-metre-v1:" "melody-metre-v1:time=3-4,complete=yes" "melody-metre-v1:time=5-4" "melody-ambitus-v1:" "melody-ambitus-v1:span=4" "melody-gapfill-v1:" "melody-gapfill-v1:leap=2,step=5,resolve=yes"; do
            f=${spec%%:*}; p=${spec#*:}
            for L in 1 2 5 17; do
              python sieve_ref.py plugin ../data/filters/$f.sfilter --length $L ${p:+--params $p} > plugin.oracle
              $S filters --plugin ../data/filters/$f.sfilter --length $L ${p:+--params $p} | tr -d '\r' > plugin.engine
              diff plugin.oracle plugin.engine
            done
          done
          # The generated text plugins (tools/build_text_plugins.py), at several lengths and settings.
          for spec in "letter-pairs-v1:" "letter-pairs-v1:min_words=5" "letter-triples-v1:" "letter-triples-v1:min_words=3" "word-cost-v1:" "word-cost-v1:rate=12,slack=8" "sentence-shape-v1:" "sentence-shape-v1:capitals=no,others=yes" "babel-punctuation-v1:"; do
            f=${spec%%:*}; p=${spec#*:}
            for L in 1 2 5 17 40; do
              python sieve_ref.py plugin ../data/filters/$f.sfilter --length $L ${p:+--params $p} > plugin.oracle
              $S filters --plugin ../data/filters/$f.sfilter --length $L ${p:+--params $p} | tr -d '\r' > plugin.engine
              diff plugin.oracle plugin.engine
            done
          done
          python sieve_ref.py plugin ../data/filters/sentence-shape-v1.sfilter --length 6 --judge ../tests/plugins/sentence-shape-cases.txt > plugin.oracle
          $S filters --plugin ../data/filters/sentence-shape-v1.sfilter --length 6 --judge ../tests/plugins/sentence-shape-cases.txt | tr -d '\r' > plugin.engine
          diff plugin.oracle plugin.engine
          # function-words-v1 reads every word of scowl-en-60-names: the oracle's lazy mode, as for Moby.
          python sieve_ref.py plugin ../data/filters/function-words-v1.sfilter --length 6 --lazy --judge ../tests/plugins/moby-sentences.txt | grep -v "^states" > plugin.oracle
          $S filters --plugin ../data/filters/function-words-v1.sfilter --length 6 --judge ../tests/plugins/moby-sentences.txt | tr -d '\r' | grep -v "^states" > plugin.engine
          diff plugin.oracle plugin.engine
          # Anchor plugins (tools/build_anchor_plugins.py): near one anchor, near several, and fragments.
          for spec in "near-example-v1:" "near-example-v1:distance=0" "near-example-v1:distance=7" "near-many-example-v1:" "contains-example-v1:"; do
            f=${spec%%:*}; p=${spec#*:}
            for L in 1 8 20 32; do
              python sieve_ref.py plugin ../tests/plugins/$f.sfilter --length $L ${p:+--params $p} > plugin.oracle
              $S filters --plugin ../tests/plugins/$f.sfilter --length $L ${p:+--params $p} | tr -d '\r' > plugin.engine
              diff plugin.oracle plugin.engine
            done
          done
          # Within d substitutions of one 32-letter page: sum over i <= d of C(32, i) 26^i.
          $S filters --plugin ../tests/plugins/near-example-v1.sfilter --length 32 --params distance=3 | grep -qx "survivors  87513089"
          for p in "" "gap=0" "mode=far" "mode=any,gap=5"; do
            for L in 1 2 5 12; do
              python sieve_ref.py plugin ../tests/plugins/toy-v2-v1.sfilter --length $L ${p:+--params $p} > plugin.oracle
              $S filters --plugin ../tests/plugins/toy-v2-v1.sfilter --length $L ${p:+--params $p} | tr -d '\r' > plugin.engine
              diff plugin.oracle plugin.engine
            done
          done
          # The notes2 family: the note plugins on sets of other ranges and durations, one to three
          # voices, each voice judged on its own (counts to the power of the voices, ranks by voice).
          for set in "--low C3 --high C6 --durations seEqQhHw" "--low F#3 --high G5 --durations EQH"; do
            for V in 1 2 3; do
              for spec in "key-data-v2:tonic=D,scale=blues" "melody-leap-v1:leap=3" "melody-rests-v1:run=1,total=2,leading=yes" "melody-range-v1:low=62,high=70"; do
                f=${spec%%:*}; p=${spec#*:}
                for L in 1 2 5; do
                  python sieve_ref.py plugin ../data/filters/$f.sfilter --line audio --note-set notes2 $set --voices $V --length $L --params $p > plugin.oracle
                  $S filters --plugin ../data/filters/$f.sfilter --line audio --note-set notes2 $set --voices $V --length $L --params $p | tr -d '\r' > plugin.engine
                  diff plugin.oracle plugin.engine
                done
              done
            done
          done
          # The Moby grammars: too large for the oracle to determinise in full (its NFA keeps each
          # token's reading apart, and the subsets run past ten million), so its lazy mode makes the
          # subsets only as they are reached: counts, ranks and verdicts on real and shuffled
          # sentences must match the engine's; the minimal size is the engine's alone.
          for f in moby-grammar-v1 moby-grammar-strict-v1; do
            python sieve_ref.py plugin ../data/filters/$f.sfilter --length 6 --lazy --judge ../tests/plugins/moby-sentences.txt | grep -v "^states" > plugin.oracle
            $S filters --plugin ../data/filters/$f.sfilter --length 6 --judge ../tests/plugins/moby-sentences.txt | tr -d '\r' | grep -v "^states" > plugin.engine
            diff plugin.oracle plugin.engine
          done
          $S filters --plugins | grep -c "^loaded" | grep -qx 23
          $S filters --plugin ../data/filters/words-data-v1.sfilter --length 6 --relations | grep -q "stricter than (implies) window-data-v1"
          rm -rf addr
          $S locate ../tests/manifest_fixture --manifest fixture.manifest --addresses addr --compare > locate.out
          python sieve_ref.py manifest ../tests/manifest_fixture | cmp - fixture.manifest
          python sieve_ref.py manifest ../tests/manifest_fixture --addresses addr
          grep -q "7z (LZMA2" locate.out
          # A map (sieve-map-v1) of the fixture is the oracle's to the byte, reads back to itself,
          # and is written for other programs as DOT and as well-formed GraphML.
          $S map ../tests/manifest_fixture --out fixture.map --dot fixture.dot --graphml fixture.graphml > /dev/null
          python sieve_ref.py map ../tests/manifest_fixture | cmp - fixture.map
          $S map fixture.map | cmp - fixture.map
          grep -q '^digraph "manifest_fixture"' fixture.dot
          python -c "import xml.dom.minidom as m; m.parse('fixture.graphml')"
          # Maps v2: a release map (files found beside it, sealed) and a map holding anchors (their
          # bytes inside it) are the oracle's to the byte; removing an anchor leaves the oracle's
          # map of the rest; a sealed map refuses to change.
          F=../tests/manifest_fixture
          $S map $F/a.txt $F/Zebra.txt --name release --seal --out rel.map 2> /dev/null
          python sieve_ref.py map $F/a.txt $F/Zebra.txt --name release --seal | cmp - rel.map
          if $S map rel.map --add $F/a.txt --out rel2.map 2> /dev/null; then exit 1; fi
          $S map --new default --out empty.map 2> /dev/null
          $S map empty.map --add "$F/sub dir/b.bin" --out held.map 2> /dev/null
          $S map held.map --add $F/a.txt --out held.map 2> /dev/null
          python sieve_ref.py map "$F/sub dir/b.bin" $F/a.txt --held --name default | cmp - held.map
          if $S map held.map --add $F/a.txt --out held2.map 2> /dev/null; then exit 1; fi
          $S map held.map --remove 1 --out held1.map 2> /dev/null
          python sieve_ref.py map $F/a.txt --held --name default | cmp - held1.map
          # Metadata on a node, set and read back as the oracle writes it.
          $S map held1.map --meta "1:source=the fixture folder" --out meta.map 2> /dev/null
          $S map meta.map --meta "1:found=2026-09-27" --out meta.map 2> /dev/null
          python sieve_ref.py map $F/a.txt --held --name default --meta "1:source=the fixture folder" --meta "1:found=2026-09-27" | cmp - meta.map
          $S map --new sealed --seal --out sealed.map 2> /dev/null
          $S map sealed.map 2>&1 | grep -c "sealed (sealed)" > /dev/null
          if $S map sealed.map --add $F/a.txt --out sealed2.map 2> /dev/null; then exit 1; fi
          # A v2 manifest (every file's address listed) is the oracle's to the byte.
          $S locate ../tests/manifest_fixture --manifest fixture2.manifest --with-addresses > /dev/null
          python sieve_ref.py manifest ../tests/manifest_fixture --with-addresses | cmp - fixture2.manifest
          # The installer: a v3 manifest (the listing, then every file's bytes; the oracle's, to the
          # byte), its address, and the folder put back from that one address, identical.
          $S locate ../tests/manifest_fixture --manifest fixture3.manifest --installer fixture.sieve > /dev/null
          python sieve_ref.py manifest ../tests/manifest_fixture --with-contents | cmp - fixture3.manifest
          # The installer is the manifest's address as raw bytes: exactly the manifest's size here,
          # which is the files' bytes and the listing, no more.
          test "$(wc -c < fixture.sieve)" = "$(wc -c < fixture3.manifest)"
          test "$(wc -c < fixture3.manifest)" = "$(( $(python sieve_ref.py manifest ../tests/manifest_fixture | wc -c) + $(awk '$1 == "bytes" {print $2}' fixture.manifest) ))"
          rm -rf installed
          $S install fixture.sieve --to installed > /dev/null
          diff -r ../tests/manifest_fixture installed
          # A single file's Sieve instructions: as a folder holding just it, the oracle's v3 manifest
          # to the byte (seen through its address), installed back as the file under its name.
          $S locate ../tests/manifest_fixture/a.txt --installer a.sieve > /dev/null
          python sieve_ref.py manifest ../tests/manifest_fixture/a.txt --with-contents > a3.manifest
          python -c "
          import sys
          o = open('a3.manifest', 'rb').read(); s = open('a.sieve', 'rb').read()
          n = int.from_bytes(o, 'big') + int('01' * len(o), 16)
          sys.exit(0 if n.to_bytes((n.bit_length() + 7) // 8, 'big') == s else 1)"
          rm -rf one_file
          $S install a.sieve --to one_file > /dev/null
          cmp one_file/a.txt ../tests/manifest_fixture/a.txt
          # An installer's manifest installs as it is too (it holds the files); a v1 manifest,
          # which only lists them, is refused.
          rm -rf installed3
          $S install fixture3.manifest --to installed3 > /dev/null
          diff -r ../tests/manifest_fixture installed3
          if $S install fixture.manifest --to installed_v1 2> /dev/null; then exit 1; fi
          # An older installer, of a v2 manifest, still installs.
          python -c "
          import sys; sys.path.insert(0, '.')
          from sieve_ref import binary_index
          d = open('fixture2.manifest', 'rb').read(); a = binary_index(d)
          open('fixture_v2.sieve', 'wb').write(a.to_bytes((a.bit_length() + 7) // 8, 'big'))"
          rm -rf installed2
          $S install fixture_v2.sieve --to installed2 > /dev/null
          diff -r ../tests/manifest_fixture installed2
          test "$($S locate ../tests/manifest_fixture/a.txt | awk '$1 == "sha256" {print $2}')" = "$(python -c "import hashlib;print(hashlib.sha256(open('../tests/manifest_fixture/a.txt','rb').read()).hexdigest())")"

      - name: The pinned model rebuilds byte for byte from its corpus (Linux)
        if: runner.os == 'Linux'
        run: |
          python tools/fetch_corpus.py
          pinned=$(awk -F'\t' '$1 == "gutenberg-lower27-o5" {print $5}' data/models/models.tsv)
          build/sieve train --out rebuilt.model
          test "$(sha256sum rebuilt.model | cut -d' ' -f1)" = "$pinned"
          (cd reference && python sieve_ref.py model-build --out ../oracle.model)
          test "$(sha256sum oracle.model | cut -d' ' -f1)" = "$pinned"
          build/sieve measure
