# Builds and tests Sieve on Windows, Linux and macOS on every push and pull request.
#
# GitHub only runs workflows from the repository root's .github/workflows folder. If this project
# lives in a subfolder of the repository (for example Potentia/Sieve), move this file to
# <repository root>/.github/workflows/build.yml and set PROJECT_DIR below to that subfolder.
name: build

on: [push, pull_request]

env:
  PROJECT_DIR: Sieve

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
    steps:
      - uses: actions/checkout@v4

      # The reference oracle: the same Python on every platform, as `python`.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit and conformance tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Same addresses on every platform
        run: |
          q() { grep -c "$@" > /dev/null; }
          exe=build/sieve
          [ -f build/Release/sieve.exe ] && exe=build/Release/sieve.exe
          $exe version
          got=$($exe warp --length 32 --mode scrambled "It was the best of times" | tr -d '\r' | awk '/scrambled/ {print $2}')
          echo "scrambled address: $got"
          test "$got" = "007b30165818bf0311497600aa52996f9395e27"
          test "$($exe read --length 32 --mode scrambled "$got" | tr -d '\r' | sed 's/ *$//')" = "it was the best of times"
          $exe dicts
          if $exe dicts | grep -Eq "MISMATCH|MISSING"; then exit 1; fi
          $exe sift --lengths 1-8 --brute-max 4 --pruned-max 5 > /dev/null
          $exe models
          if $exe models | grep -Eq "MISMATCH|MISSING|UNREADABLE"; then exit 1; fi
          # Alphabets: built in, stacked from Unicode blocks, and a line that can hold a file.
          $exe alphabets > /dev/null
          $exe alphabets --spec greek+cyrillic | tr -d '\r' | q "^symbols   400"
          # Stacking is a union, in any order: the same alphabet however it is asked for.
          test "$($exe alphabets --spec cyrillic+greek | tr -d '\r' | sed -n 1p)" = "$($exe alphabets --spec greek+cyrillic | tr -d '\r' | sed -n 1p)"
          $exe alphabets --spec all-emojis+emoticons | tr -d '\r' | q "^symbols   2048"
          $exe alphabets --spec ascii+surrogates | tr -d '\r' | q "have no text form"
          $exe alphabets --spec ascii96 | tr -d '\r' | q "^digit 0   U+000A"
          # An .obj keeps its line breaks through the ascii96 line, from either line ending.
          printf 'v 0.5 0.5\nf 1 2 3\n' > obj.txt
          printf 'v 0.5 0.5\r\nf 1 2 3\r\n' > objcrlf.txt
          a=$($exe warp --alphabet ascii96 --length 32 --mode positional --file obj.txt | tr -d '\r' | awk '$1 == "positional" {print $2}')
          b=$($exe warp --alphabet ascii96 --length 32 --mode positional --file objcrlf.txt | tr -d '\r' | awk '$1 == "positional" {print $2}')
          test "$a" = "$b"
          $exe read --alphabet ascii96 --length 32 --mode positional "$a" | tr -d '\r' | sed -n 2p | q "^f 1 2 3$"
          got=$($exe warp --length 32 --mode guided "It was the best of times" | tr -d '\r' | awk '$1 == "guided" {print $2}')
          echo "guided address: $got"
          test "$got" = "90922c700685e28"
          test "$($exe read --length 32 --mode guided "$got" | tr -d '\r' | sed 's/ *$//')" = "it was the best of times"

      - name: Filters judge, count and rank the same on every platform
        run: |
          # q PATTERN: like grep -q, but reads all its input, so the command before it never
          # gets SIGPIPE (the steps run with pipefail).
          q() { grep -c "$@" > /dev/null; }
          exe=build/sieve
          [ -f build/Release/sieve.exe ] && exe=build/Release/sieve.exe
          printf '[text]\nmode = compact\nfilters = words-v2\n' > words2.ini
          printf '[text]\nmode = compact\nfilters = words-v2, max-run-v1\n' > mixed.ini
          $exe filters --filters words2.ini | tr -d '\r' | q "^survivors    3037669199976796308182197712 "
          $exe filters --filters mixed.ini | tr -d '\r' | q "words-v2 can rank, but not together with max-run-v1"
          out=$($exe check --length 32 --filters words2.ini "It was the best of times" | tr -d '\r')
          echo "$out"
          echo "$out" | q "words-v1 *FAIL"
          echo "$out" | q "words-v2 *pass"
          k=$(echo "$out" | awk '/survivor number/ {print $(NF-2)}')
          test "$k" = "1533066303779775957571202953"
          test "$($exe read --length 32 --mode positional --filters words2.ini --survivor "$k" 2>/dev/null | tr -d '\r' | sed 's/ *$//')" = "it was the best of times"
          test "$($exe read --length 32 --mode positional --filters words2.ini --survivor 1000000 2>/dev/null | tr -d '\r' | sed 's/ *$//')" = " a a a a a a a a a a a a maim pt"
          # Compact in every ordering: warp gives the compact addresses, read takes them back.
          out=$($exe warp --length 32 --filters words2.ini --compact "It was the best of times" 2>/dev/null | tr -d '\r')
          echo "$out"
          for m in positional scrambled guided; do
            addr=$(echo "$out" | awk -v m=$m '/compact/ {seen = 1; next} seen && $1 == m {print $2; exit}')
            echo "compact $m: $addr"
            test "$($exe read --length 32 --mode $m --filters words2.ini --compact "$addr" 2>/dev/null | tr -d '\r' | sed 's/ *$//')" = "it was the best of times"
          done
          echo "$out" | q "scrambled   2afad38e8cb58c79243f9f6"
          echo "$out" | q "guided      90b25da06c4d36a  (59 bits"
          # The other lines: melodies in a key, black-and-white pictures of low entropy.
          printf '[audio]\nmode = compact\nfilters = key-v1\n[audio.key-v1]\ntonic = A\nscale = minor-pentatonic\n[image]\nmode = compact\nfilters = symbol-entropy-v1\n[image.symbol-entropy-v1]\nmax_millibits = 500\n' > lines.ini
          $exe filters --line audio --filters lines.ini | tr -d '\r' | q "^survivors    794071845499378503449051136 "
          $exe filters --line image --filters lines.ini | tr -d '\r' | q "^survivors    322091425582872 "
          printf '[image]\nmode = compact\nfilters = neighbour-agreement-v1\n' > agree.ini
          $exe filters --line image --filters agree.ini | tr -d '\r' | q "^survivors    6053792982126620565936264884 "
          $exe browse --line image --filters agree.ini --compact --count 2 --seed 4 > /dev/null
          $exe browse --line audio --filters lines.ini --compact --count 2 --seed 4 > /dev/null

      - name: A model is one object with an address on two lines
        run: |
          q() { grep -c "$@" > /dev/null; }
          exe=build/sieve
          [ -f build/Release/sieve.exe ] && exe=build/Release/sieve.exe
          $exe mesh | tr -d '\r' | q "^space        models/V8/F12/C16/key=sieve/modelspace-v1"
          $exe mesh | tr -d '\r' | q "^as text      304 characters"
          # A cube in, its address out, and the same cube back.
          printf 'v -1 -1 -1\nv 1 -1 -1\nv 1 1 -1\nv -1 1 -1\nv -1 -1 1\nv 1 -1 1\nv 1 1 1\nv -1 1 1\n' > cube.obj
          printf 'f 1 2 3\nf 1 3 4\nf 5 7 6\nf 5 8 7\nf 1 5 6\nf 1 6 2\nf 2 6 7\nf 2 7 3\nf 3 7 8\nf 3 8 4\nf 4 8 5\nf 4 5 1\n' >> cube.obj
          a=$($exe mesh --warp cube.obj 2>/dev/null | tr -d '\r' | awk '$1 == "positional" {print $2}')
          echo "cube: $a"
          test "$a" = "000f00ff00f000ff0ffff0ff0504e6b3e128a4dc725baedf8e0"
          $exe mesh --read "$a" --out round.obj 2>/dev/null
          # Symmetric on the grid, and no two spaces in a row anywhere in the canonical form.
          sed -n 1p round.obj | tr -d '\r' | q "^v -0.9375 -0.9375 -0.9375$"
          sed -n 2p round.obj | tr -d '\r' | q "^v +0.9375 -0.9375 -0.9375$"
          if grep -c "  " round.obj > /dev/null; then exit 1; fi
          test "$(wc -c < round.obj | tr -d ' ')" = "304"
          # The same file as a unit of an ascii96 text line, and back, byte for byte.
          t=$($exe warp --alphabet ascii96 --length 304 --mode positional --file round.obj | tr -d '\r' | awk '$1 == "positional" {print $2}')
          $exe read --alphabet ascii96 --length 304 --mode positional "$t" --out viatext.obj > /dev/null
          cmp round.obj viatext.obj
          b=$($exe mesh --warp viatext.obj 2>/dev/null | tr -d '\r' | awk '$1 == "positional" {print $2}')
          test "$a" = "$b"
          # Browsing the line, and a shape it cannot have.
          $exe mesh --browse 2 --seed 4 > /dev/null
          # And the same line in the hallway: a sixth door, the cube in hand, green on clay.
          H=build/hallway
          [ -f build/Release/hallway.exe ] && H=build/Release/hallway.exe
          $H --no-menu --line models --walk "0,0" --screenshot models.png | sed -n 1p | q "^MODELS line, positional"
          out=$($H --no-menu --line models --goto "$a" --walk "0,0" --take --screenshot cube.png)
          echo "$out"
          echo "$out" | q "8/8 vertices used"
          $H --no-menu --line books --pose "-1.7,7.0,0,0" --walk "-1,0" --screenshot door6.png | sed -n 1p | q "^MODELS line"
          $H --no-menu --line models --pose "-1.7,7.0,0,0" --walk "-1,0" --screenshot door7.png | sed -n 1p | q "^PAGES line"
          # The crates render their models onto their faces, and the cache has a budget.
          $H --no-menu --line models --model-cache 8 --walk "0,0" --bench 12 --screenshot crates.png 2>&1 | q "^bench: 12 frames"
          $H --main-menu --settings mc.ini --press "Down,Return,Return,Down,Down,Down,Down,Down,Down,Right,Right" --screenshot mc.png > /dev/null
          grep -q "^model_cache_mb = 80" mc.ini
          test -s models.png && test -s cube.png && test -s crates.png
          if $exe mesh --coords 12 > /dev/null 2>&1; then exit 1; fi

      - name: Books bind, unbind and keep their id in every ordering
        run: |
          # q PATTERN: like grep -q, but reads all its input, so the command before it never
          # gets SIGPIPE (the steps run with pipefail).
          q() { grep -c "$@" > /dev/null; }
          exe=build/sieve
          [ -f build/Release/sieve.exe ] && exe=build/Release/sieve.exe
          T=tests/example_book_source.txt
          # The committed example reads back to its text, and rebinding its source gives the same record.
          $exe unbind tests/example_book_v1.book --pages unbound.txt > /dev/null
          cmp unbound.txt tests/example_book_v1.pages.txt
          $exe bind --title "A Tale of Two Cities" --cover tests/example_book_cover.png --pages $T --length 400 --mode guided --out again.book
          cmp again.book tests/example_book_v1.book
          id=$(awk '$1 == "id" {print $2}' tests/example_book_v1.book)
          for m in positional scrambled; do
            $exe bind --title "A Tale of Two Cities" --cover tests/example_book_cover.png --pages $T --length 400 --mode $m --key other --out $m.book
            test "$(awk '$1 == "id" {print $2}' $m.book)" = "$id"
            $exe unbind $m.book --pages $m.txt > /dev/null
            cmp $m.txt tests/example_book_v1.pages.txt
          done
          # A changed address is refused.
          python - <<'PY'
          l = open("scrambled.book").read().split("\n")
          i = l.index("end") - 1
          l[i] = l[i][:5] + ("0" if l[i][5] != "0" else "1") + l[i][6:]
          open("tampered.book", "w").write("\n".join(l))
          PY
          if $exe unbind tampered.book > /dev/null 2>&1; then exit 1; fi
          # Book filters: the title as one page, the pages as one continuous text, so the word cut
          # by each page break is judged whole and the real book survives.
          printf '[books]\nmode = compact\n[books.title]\nfilters = title-v1\n[books.pages]\nfilters = words-v2\n' > books.ini
          out=$($exe check --book tests/example_book_v1.book --filters books.ini | tr -d '\r')
          echo "$out" | tail -4
          echo "$out" | q "^book: passes, survivor number 18219131502697305122077923717432538631140150329658"
          echo "$out" | q "scrambled  19d1fa4fa0d76f9f2d6b01ef5aa4bfc9959be451"
          $exe filters --line books --length 400 --book-pages 3 --filters books.ini | tr -d '\r' | q "^survivors    2186621054492622425964839597190822589524897221183860035461407467124"

      - name: Hallway renders, and its doors keep the corridor position (Linux, no display)
        if: runner.os == 'Linux'
        env:
          SDL_VIDEO_DRIVER: offscreen
          SDL_RENDER_DRIVER: software
        run: |
          # q PATTERN: like grep -q, but reads all its input, so the command before it never
          # gets SIGPIPE (the steps run with pipefail).
          q() { grep -c "$@" > /dev/null; }
          H=build/hallway
          W="it was the best of times"
          book() { grep -o 'first book [0-9a-f.]*' | tail -1; }
          $H --screenshot hallway.png --size 640x360
          test -s hallway.png
          here=$($H --warp "$W" --walk "0,0" --screenshot a.png | book)
          next=$($H --warp "$W" --tile 1 --walk "0,0" --screenshot b.png | book)
          # Through a door and straight back: exactly where you were.
          out=$($H --warp "$W" --pose 0,7,-90,0 --walk "-2.3,0;2.5,0" --screenshot door.png)
          echo "$out"
          echo "$out" | sed -n 1p | q "through the door into the IMAGE line"
          test "$(echo "$out" | tail -2 | book)" = "$here"
          # Through a door, one tile along, back through the door there: one tile along in text.
          out=$($H --warp "$W" --pose 0,7,-90,0 --walk "-2.3,0;-0.8,0;0,8;1.5,0" --screenshot loop.png)
          echo "$out"
          echo "$out" | tail -2 | sed -n 1p | q "PAGES line"
          test "$(echo "$out" | tail -2 | book)" = "$next"
          # Guided order: M cycles to it and - zooms out; all five doors lead back to the same book.
          $H --warp "$W" --press "M,M,-" --screenshot keys.png | tail -2 | sed -n 1p | q "PAGES line, guided zoom 57"
          start=$($H --mode guided --warp "$W" --zoom 20 --walk "0,0" --screenshot start.png | book)
          out=$($H --mode guided --warp "$W" --zoom 20 --pose 0,7,-90,0 --walk "-2.3,0;-4.2,0;-4.2,0;-4.2,0;-4.2,0;-4.2,0" --screenshot guided.png)
          echo "$out"
          echo "$out" | q "VIDEO line"
          echo "$out" | q "BOOKS line"
          echo "$out" | q "MODELS line"
          echo "$out" | tail -2 | sed -n 1p | q "PAGES line, guided"
          test "$(echo "$out" | tail -2 | book)" = "$start"
          # Loops: a 2-character line is 729 units = 6 tiles, so tile 6 starts the second copy,
          # and the CLI reads the same corridor places the hallway shows.
          $H --length 2 --goto @6 --walk "0,0" --screenshot loop6.png | q "first book 000 "
          test "$(build/sieve read --length 2 --mode positional --at 6:0 2>/dev/null)" = "  "
          test "$(build/sieve read --length 2 --mode positional --at -1:127 2>/dev/null)" = "(empty: padding at the end of a loop)"
          build/sieve info --length 2 | q "39 empty slots"
          build/sieve info --line image | q "fills whole tiles exactly"
          # The setup menu renders at ordinary and enormous sizes, and scripted keys reach it.
          $H --menu --screenshot menu.png | q "saved menu.png"
          $H --menu --press "Down,Down,Down,Right,PageUp" --screenshot menu2.png | q "saved menu2.png"
          $H --menu --length 4000000000 --video-width 100000 --video-frames 100000 --screenshot menu3.png | q "saved menu3.png"
          test -s menu.png && test -s menu2.png && test -s menu3.png
          # Books: the fifth line. Its books are a cover, a title and pages; the committed example
          # book opens on its shelf when the lines have its shape, and page N turns.
          $H --line books --walk "0,0" --screenshot books.png | sed -n 1p | q "BOOKS line, positional, filters: none"
          out=$($H --line books --length 400 --book-pages 3 --warp tests/example_book_v1.book --walk "0,0" --press N --screenshot book-open.png)
          echo "$out"
          echo "$out" | sed -n 1p | q '"a tale of two cities'
          echo "$out" | q "opened the book"
          $H --line books --warp tests/example_book_v1.book --walk "0,0" --screenshot book-wrong.png | sed -n 1p | q "in the menu to the book's shape"
          $H --line books --mode scrambled --walk "0,0" --take --screenshot book-hand.png | sed -n 1p | q "BOOKS line, scrambled"
          printf '[books]\nmode = compact\n[books.title]\nfilters = title-v1\n[books.pages]\nfilters = words-v2\n' > books.ini
          $H --filters books.ini --line books --length 400 --book-pages 3 --warp tests/example_book_v1.book --walk "0,0" --screenshot book-compact.png | sed -n 1p | q "surviving books"
          $H --filters books.ini --line books --length 400 --book-pages 3 --mode scrambled --walk "0,0" --take --screenshot book-compact2.png | sed -n 1p | q "BOOKS line, scrambled, filters: 0+1+1 compact"
          $H --menu --screenshot menu5.png | q "saved menu5.png"
          # The main menu, its settings screens and a language file with gaps (English fills them).
          $H --main-menu --screenshot main.png | q "saved main.png"
          $H --line image --edge-glow --walk "0,0" --screenshot glow.png 2>&1 | q "graphics: edge glow on, real graphics off"
          # Real Graphics: every line loads the templates. (Committing a per-line model, e.g.
          # data/meshes/book-audio.obj, changes this line: update it then.)
          out=$($H --line audio --real-graphics --walk "0,0" --screenshot real.png 2>&1)
          echo "$out" | q "real graphics for the audio line: hallway=hallway.obj bookshelf=bookshelf.obj book=book.obj marker=marker.obj"
          out=$($H --real-graphics --fps-counter --bench 5 --walk "0,0" --screenshot fps.png 2>&1)
          echo "$out" | q "^bench: 5 frames"
          echo "$out" | q "graphics: edge glow off, real graphics on, door portals on, fps counter on"
          # Door Portals: Real Graphics brings them, and they also stand alone with the wireframe.
          $H --line image --door-portals --walk "0,0" --screenshot portal.png 2>&1 | q "door portals on"
          $H --line image --edge-glow --walk "0,0" --screenshot noportal.png 2>&1 | q "door portals off"
          test -s portal.png && test -s noportal.png
          $H --main-menu --press "Down,Return,Return,Return" --screenshot main-res.png | q "saved"
          # Settings, Graphics, then VSync off, Geometry Edge Glow on, Real Graphics on — which
          # turns the glow back off, the two being mutually exclusive. From a settings file that
          # does not exist yet, so the toggles start from their defaults whatever ran before.
          rm -f app.ini
          $H --main-menu --settings app.ini --press "Down,Return,Return,Down,Down,Return,Down,Return,Down,Return" --screenshot main-gfx.png > /dev/null
          grep -q "^vsync = off" app.ini
          grep -q "^edge_glow = off" app.ini
          grep -q "^real_graphics = on" app.ini
          grep -q "^door_portals = on" app.ini   # Real Graphics brings Door Portals with it
          mkdir -p lt/data/lang && cp data/lang/en.txt lt/data/lang/ && printf 'language.name = Test\nitem.start = START TEST\n' > lt/data/lang/tt.txt
          (cd lt && ../$H --main-menu --language tt --screenshot ../main-tt.png) | q "main menu: language tt, font sieve8x8"
          # The language's font: sieve8x8 draws accented and Greek letters; a missing font is reported.
          mkdir -p lt/data/fonts && cp data/fonts/sieve8x8.hex lt/data/fonts/
          printf 'font = sieve8x8\nlanguage.name = Fran\xc3\xa7ais\nitem.start = D\xc3\xa9marrer Sieve\n' > lt/data/lang/fr.txt
          out=$(cd lt && ../$H --main-menu --language fr --screenshot ../main-fr.png 2>&1)
          echo "$out" | q "main menu: language fr, font sieve8x8"
          if echo "$out" | grep -c "not found" > /dev/null; then exit 1; fi
          printf 'font = nosuchfont\nitem.start = X\n' > lt/data/lang/xx.txt
          out=$(cd lt && ../$H --main-menu --language xx --screenshot ../main-xx.png 2>&1)
          echo "$out" | q "font 'nosuchfont' not found"
          echo "$out" | q "main menu: language xx, font sieve8x8"
          # Filter modes: compact shelves only survivors (warped text lands on a shelf, not in hand),
          # an unrankable stack falls back to hide, and the filter overlay renders.
          printf '[text]\nmode = compact\nfilters = words-v2\n' > words2.ini
          printf '[text]\nmode = compact\nfilters = words-v2, max-run-v1\n' > mixed.ini
          printf '[text]\nmode = mark\nfilters = words-v1\n' > mark.ini
          printf '[audio]\nmode = compact\nfilters = key-v1\n[audio.key-v1]\ntonic = A\nscale = minor-pentatonic\n[image]\nmode = compact\nfilters = symbol-entropy-v1\n[image.symbol-entropy-v1]\nmax_millibits = 500\n' > lines.ini
          out=$($H --filters words2.ini --warp "$W" --walk "0,0" --screenshot compact.png)
          echo "$out"
          echo "$out" | q "filters: 1 compact (303766...7712 (28 digits) survivors), tile 119770...5023 (26 digits)"
          $H --filters mixed.ini --walk "0,0" --screenshot mixed.png | q "filters: 2 hide (compact: words-v2 can rank, but not together with max-run-v1)"
          $H --filters mark.ini --length 3 --walk "0,0" --screenshot mark.png | q "filters: 1 mark"
          $H --menu --filters words2.ini --press "F" --screenshot overlay.png | q "saved overlay.png"
          # Compact in the scrambled and guided orderings, and on the image and audio lines.
          $H --filters words2.ini --mode scrambled --warp "$W" --walk "0,0" --screenshot cs.png | sed -n 1p | q "PAGES line, scrambled, filters: 1 compact"
          $H --filters words2.ini --mode guided --warp "$W" --walk "0,0" --screenshot cg.png | sed -n 1p | q "PAGES line, guided zoom 59, filters: 1 compact"
          $H --filters lines.ini --line image --mode scrambled --walk "0,0" --screenshot ci.png | sed -n 1p | q "IMAGE line, scrambled, filters: 1 compact (322091425582872 survivors)"
          $H --filters lines.ini --line audio --walk "0,0" --screenshot ca.png | sed -n 1p | q "AUDIO line, positional, filters: 1 compact"
          test -s compact.png && test -s mixed.png && test -s mark.png && test -s overlay.png

      - name: Reference oracle reproduces the committed vectors
        run: |
          cd reference
          python sieve_ref.py vectors       | diff - ../tests/vectors_v1.tsv
          python sieve_ref.py digit-vectors | diff - ../tests/vectors_digits_v1.tsv
          python sieve_ref.py canon-vectors | diff - ../tests/vectors_canon.tsv
          python sieve_ref.py alphabet-vectors | diff - ../tests/vectors_alphabets_v1.tsv
          python sieve_ref.py model-vectors | diff - ../tests/vectors_models_v1.tsv
          python sieve_ref.py image-vectors | diff - ../tests/vectors_image_v1.tsv
          python sieve_ref.py guided-vectors | diff - ../tests/vectors_guided_v1.tsv
          python sieve_ref.py filter-vectors | diff - ../tests/vectors_filters_v1.tsv
          python sieve_ref.py compact-vectors | diff - ../tests/vectors_compact_v1.tsv
          python sieve_ref.py book-vectors | diff - ../tests/vectors_books_v1.tsv
          python sieve_ref.py book-filter-vectors | diff - ../tests/vectors_book_filters_v1.tsv
          python sieve_ref.py book-read ../tests/example_book_v1.book > book.out
          test "$(head -1 book.out)" = "$(awk '$1 == "id" {print $2}' ../tests/example_book_v1.book)"
          tail -n +3 book.out | cmp - ../tests/example_book_v1.pages.txt

      - name: The pinned model rebuilds byte for byte from its corpus (Linux)
        if: runner.os == 'Linux'
        run: |
          python tools/fetch_corpus.py
          pinned=$(awk -F'\t' '$1 == "gutenberg-lower27-o5" {print $5}' data/models/models.tsv)
          build/sieve train --out rebuilt.model
          test "$(sha256sum rebuilt.model | cut -d' ' -f1)" = "$pinned"
          (cd reference && python sieve_ref.py model-build --out ../oracle.model)
          test "$(sha256sum oracle.model | cut -d' ' -f1)" = "$pinned"
          build/sieve measure
