# Builds and tests Sieve on Windows, Linux and macOS on every push and pull request.
#
# GitHub only runs workflows from the repository root's .github/workflows folder. If this project
# lives in a subfolder of the repository (for example Potentia/Sieve), move this file to
# <repository root>/.github/workflows/build.yml and set PROJECT_DIR below to that subfolder.
name: build

on: [push, pull_request]

env:
  PROJECT_DIR: Sieve

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
    steps:
      - uses: actions/checkout@v4

      # The reference oracle: the same Python on every platform, as `python`.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit and conformance tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Same addresses on every platform
        run: |
          q() { grep -c "$@" > /dev/null; }
          exe=build/sieve
          [ -f build/Release/sieve.exe ] && exe=build/Release/sieve.exe
          $exe version
          got=$($exe warp --length 32 --mode scrambled "It was the best of times" | tr -d '\r' | awk '/scrambled/ {print $2}')
          echo "scrambled address: $got"
          test "$got" = "007b30165818bf0311497600aa52996f9395e27"
          test "$($exe read --length 32 --mode scrambled "$got" | tr -d '\r' | sed 's/ *$//')" = "it was the best of times"
          $exe dicts
          if $exe dicts | grep -Eq "MISMATCH|MISSING"; then exit 1; fi
          $exe sift --lengths 1-8 --brute-max 4 --pruned-max 5 > /dev/null
          $exe models
          if $exe models | grep -Eq "MISMATCH|MISSING|UNREADABLE"; then exit 1; fi
          # Alphabets: built in, stacked from Unicode blocks, and a line that can hold a file.
          $exe alphabets > /dev/null
          $exe alphabets --spec greek+cyrillic | tr -d '\r' | q "^symbols   400"
          # Stacking is a union, in any order: the same alphabet however it is asked for.
          test "$($exe alphabets --spec cyrillic+greek | tr -d '\r' | sed -n 1p)" = "$($exe alphabets --spec greek+cyrillic | tr -d '\r' | sed -n 1p)"
          $exe alphabets --spec all-emojis+emoticons | tr -d '\r' | q "^symbols   2048"
          $exe alphabets --spec ascii+surrogates | tr -d '\r' | q "have no text form"
          $exe alphabets --spec ascii96 | tr -d '\r' | q "^digit 0   U+000A"
          # An .obj keeps its line breaks through the ascii96 line, from either line ending.
          printf 'v 0.5 0.5\nf 1 2 3\n' > obj.txt
          printf 'v 0.5 0.5\r\nf 1 2 3\r\n' > objcrlf.txt
          a=$($exe warp --alphabet ascii96 --length 32 --mode positional --file obj.txt | tr -d '\r' | awk '$1 == "positional" {print $2}')
          b=$($exe warp --alphabet ascii96 --length 32 --mode positional --file objcrlf.txt | tr -d '\r' | awk '$1 == "positional" {print $2}')
          test "$a" = "$b"
          $exe read --alphabet ascii96 --length 32 --mode positional "$a" | tr -d '\r' | sed -n 2p | q "^f 1 2 3$"
          got=$($exe warp --length 32 --mode guided "It was the best of times" | tr -d '\r' | awk '$1 == "guided" {print $2}')
          echo "guided address: $got"
          test "$got" = "90922c700685e28"
          test "$($exe read --length 32 --mode guided "$got" | tr -d '\r' | sed 's/ *$//')" = "it was the best of times"

      - name: Filters judge, count and rank the same on every platform
        run: |
          # q PATTERN: like grep -q, but reads all its input, so the command before it never
          # gets SIGPIPE (the steps run with pipefail).
          q() { grep -c "$@" > /dev/null; }
          exe=build/sieve
          [ -f build/Release/sieve.exe ] && exe=build/Release/sieve.exe
          printf '[text]\nmode = compact\nfilters = words-v2\n' > words2.ini
          printf '[text]\nmode = compact\nfilters = words-v2, max-run-v1\n' > mixed.ini
          $exe filters --filters words2.ini | tr -d '\r' | q "^survivors    3037669199976796308182197712 "
          $exe filters --filters mixed.ini | tr -d '\r' | q "words-v2 can rank, but not together with max-run-v1"
          out=$($exe check --length 32 --filters words2.ini "It was the best of times" | tr -d '\r')
          echo "$out"
          echo "$out" | q "words-v1 *FAIL"
          echo "$out" | q "words-v2 *pass"
          k=$(echo "$out" | awk '/survivor number/ {print $(NF-2)}')
          test "$k" = "1533066303779775957571202953"
          test "$($exe read --length 32 --mode positional --filters words2.ini --survivor "$k" 2>/dev/null | tr -d '\r' | sed 's/ *$//')" = "it was the best of times"
          test "$($exe read --length 32 --mode positional --filters words2.ini --survivor 1000000 2>/dev/null | tr -d '\r' | sed 's/ *$//')" = " a a a a a a a a a a a a maim pt"
          # Compact in every ordering: warp gives the compact addresses, read takes them back.
          out=$($exe warp --length 32 --filters words2.ini --compact "It was the best of times" 2>/dev/null | tr -d '\r')
          echo "$out"
          for m in positional scrambled guided; do
            addr=$(echo "$out" | awk -v m=$m '/compact/ {seen = 1; next} seen && $1 == m {print $2; exit}')
            echo "compact $m: $addr"
            test "$($exe read --length 32 --mode $m --filters words2.ini --compact "$addr" 2>/dev/null | tr -d '\r' | sed 's/ *$//')" = "it was the best of times"
          done
          echo "$out" | q "scrambled   2afad38e8cb58c79243f9f6"
          echo "$out" | q "guided      90b25da06c4d36a  (59 bits"
          # The other lines: melodies in a key, black-and-white pictures of low entropy.
          printf '[audio]\nmode = compact\nfilters = key-v1\n[audio.key-v1]\ntonic = A\nscale = minor-pentatonic\n[image]\nmode = compact\nfilters = symbol-entropy-v1\n[image.symbol-entropy-v1]\nmax_millibits = 500\n' > lines.ini
          $exe filters --line audio --filters lines.ini | tr -d '\r' | q "^survivors    794071845499378503449051136 "
          $exe filters --line image --filters lines.ini | tr -d '\r' | q "^survivors    322091425582872 "
          printf '[image]\nmode = compact\nfilters = neighbour-agreement-v1\n' > agree.ini
          $exe filters --line image --filters agree.ini | tr -d '\r' | q "^survivors    6053792982126620565936264884 "
          $exe browse --line image --filters agree.ini --compact --count 2 --seed 4 > /dev/null
          $exe browse --line audio --filters lines.ini --compact --count 2 --seed 4 > /dev/null
          # The notes2 family: two voices of a larger set, warped, and a stack of melody plugins
          # that judges each voice, counting one voice's survivors squared (218112^2).
          $exe warp --line audio --note-set notes2 --voices 2 --length 6 "C4q E4q. G4h Bb5s // C3w G2h" | tr -d '\r' | q "C4q E4q. G4h A#5s Rs Rs // C3w G3h Rs Rs Rs Rs"
          printf '[audio]\nmode = compact\nfilters = key-data-v2, melody-leap-v1\n[audio.key-data-v2]\ntonic = D\n[audio.melody-leap-v1]\nleap = 2\n' > n2.ini
          $exe filters --line audio --note-set notes2 --voices 1 --length 3 --filters n2.ini | tr -d '\r' | q "^survivors    218112 "
          $exe filters --line audio --note-set notes2 --voices 2 --length 3 --filters n2.ini | tr -d '\r' | q "^survivors    47572844544 "
          $exe browse --line audio --note-set notes2 --voices 2 --length 3 --filters n2.ini --compact --count 2 --seed 4 | tr -d '\r' | q " // "

      - name: A model is one object with an address on two lines
        run: |
          q() { grep -c "$@" > /dev/null; }
          exe=build/sieve
          [ -f build/Release/sieve.exe ] && exe=build/Release/sieve.exe
          $exe mesh | tr -d '\r' | q "^space        models/V8/F12/C16/key=sieve/modelspace-v1"
          $exe mesh | tr -d '\r' | q "^as text      304 characters"
          # A cube in, its address out, and the same cube back.
          printf 'v -1 -1 -1\nv 1 -1 -1\nv 1 1 -1\nv -1 1 -1\nv -1 -1 1\nv 1 -1 1\nv 1 1 1\nv -1 1 1\n' > cube.obj
          printf 'f 1 2 3\nf 1 3 4\nf 5 7 6\nf 5 8 7\nf 1 5 6\nf 1 6 2\nf 2 6 7\nf 2 7 3\nf 3 7 8\nf 3 8 4\nf 4 8 5\nf 4 5 1\n' >> cube.obj
          a=$($exe mesh --warp cube.obj 2>/dev/null | tr -d '\r' | awk '$1 == "positional" {print $2}')
          echo "cube: $a"
          test "$a" = "000f00ff00f000ff0ffff0ff0504e6b3e128a4dc725baedf8e0"
          $exe mesh --read "$a" --out round.obj 2>/dev/null
          # Symmetric on the grid, and no two spaces in a row anywhere in the canonical form.
          sed -n 1p round.obj | tr -d '\r' | q "^v -0.9375 -0.9375 -0.9375$"
          sed -n 2p round.obj | tr -d '\r' | q "^v +0.9375 -0.9375 -0.9375$"
          if grep -c "  " round.obj > /dev/null; then exit 1; fi
          test "$(wc -c < round.obj | tr -d ' ')" = "304"
          # The same file as a unit of an ascii96 text line, and back, byte for byte.
          t=$($exe warp --alphabet ascii96 --length 304 --mode positional --file round.obj | tr -d '\r' | awk '$1 == "positional" {print $2}')
          $exe read --alphabet ascii96 --length 304 --mode positional "$t" --out viatext.obj > /dev/null
          cmp round.obj viatext.obj
          b=$($exe mesh --warp viatext.obj 2>/dev/null | tr -d '\r' | awk '$1 == "positional" {print $2}')
          test "$a" = "$b"
          # Browsing the line, and a shape it cannot have.
          $exe mesh --browse 2 --seed 4 > /dev/null
          # And the same line in the hallway: a sixth door, the cube in hand, green on clay.
          H=build/hallway
          [ -f build/Release/hallway.exe ] && H=build/Release/hallway.exe
          $H --no-menu --line models --walk "0,0" --screenshot models.png | sed -n 1p | q "^MODELS line, positional"
          out=$($H --no-menu --line models --goto "$a" --walk "0,0" --take --screenshot cube.png)
          echo "$out"
          echo "$out" | q "8/8 vertices used"
          $H --no-menu --line books --pose "-1.7,7.0,0,0" --walk "-1,0" --screenshot door6.png | sed -n 1p | q "^MODELS line"
          # The crates render their models onto their faces, and the cache has a budget.
          $H --no-menu --line models --model-cache 8 --walk "0,0" --bench 12 --screenshot crates.png 2>&1 | q "^bench: 12 frames"
          # The display cache is a world setting, in the setup menu's GLOBAL section (row 8),
          # in steps of 8 MB, and saved with the application's settings. From a settings file that
          # does not exist yet, so it starts at its default.
          rm -f mc.ini
          downs=$(python -c "print(','.join(['Down']*8))")
          $H --menu --settings mc.ini --press "$downs,Right,Right" --screenshot mc.png > /dev/null
          grep -q "^model_cache_mb = 80" mc.ini
          # The filter memory, the last GLOBAL row (11): what one count's tables may take, in steps of
          # 256 MB from 512, saved with the application's settings.
          rm -f fm.ini
          downs=$(python -c "print(','.join(['Down']*11))")
          $H --menu --settings fm.ini --press "$downs,Right" --screenshot fm.png > /dev/null
          grep -q "^filter_memory_mb = 768" fm.ini
          # ...and Graphics Memory, which the setup menu's budget keeps it within, is a graphics
          # setting: Settings, Graphics, then the seventh row.
          rm -f gm.ini
          $H --main-menu --settings gm.ini --press "Down,Return,Return,Down,Down,Down,Down,Down,Down,Right" --screenshot gm.png > /dev/null
          grep -q "^graphics_memory_gb = 5" gm.ini
          # A different shape is a different line, and the setup menu draws all six of them.
          $exe mesh --vertices 12 --faces 20 --coords 64 | tr -d '\r' | q "^space        models/V12/F20/C64/key=sieve/modelspace-v1"
          $H --no-menu --line models --vertices 12 --faces 20 --coords 64 --walk "0,0" --screenshot shape.png | sed -n 1p | q "^MODELS line"
          $H --menu --vertices 12 --faces 20 --coords 64 --screenshot map6.png | q "saved map6.png"
          # The setup menu's last three rows: find my limits, reset, and the way in. Finding the
          # limits changes every shape; resetting puts them all back.
          # Up from the first row wraps to the last, so three Ups land on find-my-limits whatever
          # else is in the list: the last three rows are always find-my-limits, reset, the way in.
          toend="Up,Up,Up"
          $H --menu --press "$toend" --screenshot plain.png > /dev/null
          $H --menu --press "$toend,Return" --screenshot lim.png > /dev/null
          $H --menu --press "$toend,Return,Down,Return,Up" --screenshot res.png > /dev/null
          # Finding the limits changes the shapes; resetting puts them back exactly as they were.
          if cmp -s plain.png lim.png; then exit 1; fi
          cmp -s plain.png res.png
          # The setup menu's rows are numbered, and F on a row opens that line's filters, so the
          # mapping has to be pinned or a row inserted anywhere above silently opens the wrong
          # line's list. Each row here ticks a mode and the saved file says which line it was.
          # Closing the overlay is what writes it, which also covers that path.
          # (The audio rows are six: its notes, its note set, and notes2's range, durations and voices.)
          for pair in "12 text" "16 image" "19 audio" "22 audio" "25 video" "29 books" "30 models" "33 binary"; do
            set -- $pair
            rm -f row$1.ini
            downs=$(python -c "print(','.join(['Down']*$1))")
            $H --menu --filters row$1.ini --press "$downs,F,Space,Escape" --screenshot row$1.png > /dev/null
            grep -A1 "^\[$2\]" row$1.ini | q "mode = mark"
          done
          # On the rows that belong to no line, F opens the filters of the line you start on: pages
          # by default, and models once the "line" row (the first) is turned to models.
          rm -f start.ini start2.ini
          $H --menu --filters start.ini --press "F,Space,Escape" --screenshot start.png > /dev/null
          grep -A1 "^\[text\]" start.ini | q "mode = mark"
          $H --menu --filters start2.ini --press "Right,Right,Right,Right,Right,F,Space,Escape" --screenshot start2.png > /dev/null
          grep -A1 "^\[models\]" start2.ini | q "mode = mark"
          # Items per wall: the corridor's tile size is a setting. It changes no address -- the
          # same unit, at the same percentage along the same line -- only the tile and slot that
          # name where it stands, and at 256 a tile the tile number is half what it was. Untitled
          # (title length 0), so the starting page stands well along the line, not at its start.
          a=$($H --no-menu --title-length 0 --walk "0,0" --screenshot t128.png | sed -n 1p)
          b=$($H --no-menu --title-length 0 --items-per-wall 256 --walk "0,0" --screenshot t256.png | sed -n 1p)
          echo "$a"; echo "$b"
          echo "$a" | q "85.9326950016% along"
          echo "$b" | q "85.9326950016% along"
          # ...and it is the same book, with the same address, on both.
          test "$(echo "$a" | book)" = "$(echo "$b" | book)"
          if [ "$(echo "$a" | sed -n 's/.*tile \([0-9.]*\).*/\1/p')" = "$(echo "$b" | sed -n 's/.*tile \([0-9.]*\).*/\1/p')" ]; then exit 1; fi
          # What stands in a slot is scaled to the slot, so twice as many to a tile is half-size
          # items rather than items running into each other: an item must be narrower than the
          # pitch at every size, or the crosshair cannot tell two of them apart.
          python -c "shelf=6.0; base=shelf/16; bad=[n for n in (128,256,512,1024) if not 0.28*min(1.0,(shelf/(n//8))/base) < shelf/(n//8)]; assert not bad, bad; print('slots fit at every tile size')"
          $H --no-menu --items-per-wall 256 --take --screenshot take256.png | q "saved take256.png"
          # The pictures on the crate faces have a size of their own, and it is thrown away and
          # redrawn when it changes rather than being stretched.
          $H --no-menu --line models --model-tile 128 --walk "0,0" --bench 8 --screenshot tile128.png 2>&1 | q "^bench: 8 frames"
          test -s t128.png && test -s t256.png && test -s tile128.png
          # The item page has two tabs: the thing itself, and what it costs to name it. On a text
          # line the guided row is shorter than the other two exactly when the unit reads as text.
          $H --no-menu --warp "it was the best of times" --press "E,C" --screenshot cost.png > /dev/null
          test -s cost.png
          # The compass: the degree readout beside the percentage, to the precision set in Graphics.
          $H --no-menu --line pages --goto "25%" --walk "0,0" --screenshot comp.png | sed -n 1p | q "25.0000000000% along"
          test -s comp.png
          # The binary line: one wall of empty shelves, and on the other side the edge, the short
          # wall and the rain falling off it. It draws with whatever font is present, so it works
          # with Sieve's own small one.
          python -c "import ast,sys; ast.parse(open('tools/fetch_unifont.py').read())"
          $H --no-menu --line binary --pose "0,1.7,4,0" --bench 8 --screenshot edge.png 2>&1 | q "^bench: 8 frames"
          # It is a line like the others now: every file up to its length, one loop (its filters,
          # by the files' kinds, are checked with the other filters below).
          $H --no-menu --line binary --walk "0,0" --screenshot bin.png | sed -n 1p | q "^BINARY line"
          # The six lines no longer loop into one another: they start and finish at binary.
          # Left out of models is binary, where you are turned round to come out of its one door
          # (in its left wall); back out through that door is models again. Right out of pages is
          # binary too, and there the door leads back to pages.
          $H --no-menu --line models --pose "-1.7,7.0,0,0" --walk "-1,0" --screenshot door7.png | sed -n 1p | q "^BINARY line"
          # (A walk is in the walker's frame, so after being turned round, 4.2 is back the way you came.)
          $H --no-menu --line models --pose "-1.7,7.0,0,0" --walk "-1,0;4.2,0" --screenshot door8.png | sed -n 2p | q "^MODELS line"
          $H --no-menu --line pages --pose "1.7,7.0,0,0" --walk "1,0" --screenshot door9.png | sed -n 1p | q "^BINARY line"
          $H --no-menu --line pages --pose "1.7,7.0,0,0" --walk "1,0;-1,0" --screenshot door10.png | sed -n 2p | q "^PAGES line"
          # Binary's other side is the drop, always on its right: the short wall stops you at the
          # edge of the floor. No door, no crossing, whatever the doorway is doing at that z.
          $H --no-menu --line models --pose "-1.7,7.0,0,0" --walk "-1,0;-9,0" --screenshot walk.png | sed -n 2p | q "^BINARY line.*x 1.650000"
          # There is no setting for it: not in Settings > Graphics, not in a settings file that
          # Graphics has just written, and not on the command line.
          rm -f be.ini
          $H --main-menu --settings be.ini --press "Down,Return,Return,Down,Down,Down,Return" --screenshot be.png > /dev/null
          grep -q "^edge_glow = on" be.ini
          if grep -q "binary" be.ini; then exit 1; fi
          if $H --help 2>&1 | grep -q "binary-edge"; then exit 1; fi
          test -s walk.png
          test -s edge.png
          test -s models.png && test -s cube.png && test -s crates.png && test -s map6.png
          if $exe mesh --coords 12 > /dev/null 2>&1; then exit 1; fi

      - name: BigUint's arithmetic also builds and passes without a 128-bit integer type
        if: runner.os == 'Linux'
        run: |
          # Every limb operation has two implementations: one using the compiler's 128-bit
          # integer, and one built from 32-bit halves for compilers that have no such type.
          # The second is the one nothing would otherwise exercise, so it is built and run here
          # against the same vectors.
          cmake -S . -B build-portable -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="-DSIEVE_BIGUINT_PORTABLE"
          cmake --build build-portable --target sieve_tests --parallel
          ./build-portable/sieve_tests tests | tail -1 | grep -q ", 0 failures"

      - name: A file is one unit of the bytes256 line, and its address is its own bytes
        run: |
          q() { grep -c "$@" > /dev/null; }
          exe=build/sieve
          [ -f build/Release/sieve.exe ] && exe=build/Release/sieve.exe
          # bytes256 holds every byte value in byte order, so canonicalisation is the identity
          # (canon-bytes-v1) and a file of N bytes is exactly one unit of a line of length N.
          $exe alphabets | tr -d '\r' | q "bytes256"
          python -c "open('four.bin','wb').write(bytes([0xde,0xad,0xbe,0xef]))"
          out=$($exe warp --alphabet bytes256 --length 4 --file four.bin)
          echo "$out"
          echo "$out" | q "canon-bytes-v1"
          # The positional address IS the file, read as one number.
          echo "$out" | q "deadbeef"
          $exe read --alphabet bytes256 --length 4 --mode positional deadbeef --out back.bin > /dev/null
          cmp four.bin back.bin
          # A file-sized address is far too long for a command line, so it can come from a file.
          python -c "d=open('$exe','rb').read()[:20000]; open('big.bin','wb').write(d); open('big.hex','w').write(d.hex())"
          $exe read --alphabet bytes256 --length 20000 --mode positional --address-file big.hex --out back2.bin > /dev/null
          cmp big.bin back2.bin
          # Nothing is folded away: a file of every byte value comes back unchanged.
          python -c "open('all.bin','wb').write(bytes(range(256)))"
          python -c "open('all.hex','w').write(bytes(range(256)).hex())"
          $exe read --alphabet bytes256 --length 256 --mode positional --address-file all.hex --out allback.bin > /dev/null
          cmp all.bin allback.bin
          # ...and the address it prints for that file is exactly that hex dump.
          $exe warp --alphabet bytes256 --length 256 --file all.bin | tr -d '\r' | q "000102030405"

      - name: Books bind, unbind and keep their id in every ordering
        run: |
          # q PATTERN: like grep -q, but reads all its input, so the command before it never
          # gets SIGPIPE (the steps run with pipefail).
          q() { grep -c "$@" > /dev/null; }
          exe=build/sieve
          [ -f build/Release/sieve.exe ] && exe=build/Release/sieve.exe
          T=tests/example_book_source.txt
          # The committed example reads back to its text, and rebinding its source gives the same record.
          $exe unbind tests/example_book_v1.book --pages unbound.txt > /dev/null
          cmp unbound.txt tests/example_book_v1.pages.txt
          $exe bind --title "A Tale of Two Cities" --cover tests/example_book_cover.png --pages $T --length 400 --mode guided --out again.book
          cmp again.book tests/example_book_v1.book
          id=$(awk '$1 == "id" {print $2}' tests/example_book_v1.book)
          for m in positional scrambled; do
            $exe bind --title "A Tale of Two Cities" --cover tests/example_book_cover.png --pages $T --length 400 --mode $m --key other --out $m.book
            test "$(awk '$1 == "id" {print $2}' $m.book)" = "$id"
            $exe unbind $m.book --pages $m.txt > /dev/null
            cmp $m.txt tests/example_book_v1.pages.txt
          done
          # A changed address is refused.
          python - <<'PY'
          l = open("scrambled.book").read().split("\n")
          i = l.index("end") - 1
          l[i] = l[i][:5] + ("0" if l[i][5] != "0" else "1") + l[i][6:]
          open("tampered.book", "w").write("\n".join(l))
          PY
          if $exe unbind tampered.book > /dev/null 2>&1; then exit 1; fi
          # Book filters: the title as one page, the pages as one continuous text, so the word cut
          # by each page break is judged whole and the real book survives.
          printf '[books]\nmode = compact\n[books.title]\nfilters = title-v1\n[books.pages]\nfilters = words-v2\n' > books.ini
          out=$($exe check --book tests/example_book_v1.book --filters books.ini | tr -d '\r')
          echo "$out" | tail -4
          echo "$out" | q "^book: passes, survivor number 18219131502697305122077923717432538631140150329658"
          echo "$out" | q "scrambled  19d1fa4fa0d76f9f2d6b01ef5aa4bfc9959be451"
          $exe filters --line books --length 400 --book-pages 3 --filters books.ini | tr -d '\r' | q "^survivors    2186621054492622425964839597190822589524897221183860035461407467124"

      - name: Hallway renders, and its doors keep the corridor position (Linux, no display)
        if: runner.os == 'Linux'
        env:
          SDL_VIDEO_DRIVER: offscreen
          SDL_RENDER_DRIVER: software
        run: |
          # q PATTERN: like grep -q, but reads all its input, so the command before it never
          # gets SIGPIPE (the steps run with pipefail).
          q() { grep -c "$@" > /dev/null; }
          H=build/hallway
          W="it was the best of times"
          book() { grep -o 'first book [0-9a-f.]*' | tail -1; }
          $H --screenshot hallway.png --size 640x360
          test -s hallway.png
          here=$($H --warp "$W" --walk "0,0" --screenshot a.png | book)
          next=$($H --warp "$W" --tile 1 --walk "0,0" --screenshot b.png | book)
          # Through a door and straight back: exactly where you were.
          out=$($H --warp "$W" --pose 0,7,-90,0 --walk "-2.3,0;2.5,0" --screenshot door.png)
          echo "$out"
          echo "$out" | sed -n 1p | q "through the door into the IMAGE line"
          test "$(echo "$out" | tail -2 | book)" = "$here"
          # A door keeps your angle: 36.25% along pages is 36.25% along images; one tile along
          # there and back through the door is still 36.25% (to the readout's ten places), on pages.
          out=$($H --goto "36.25%" --pose 0,7,-90,0 --walk "-2.3,0;-0.8,0;0,8;1.5,0" --screenshot loop.png)
          echo "$out"
          echo "$out" | sed -n 1p | q "IMAGE line.* 36.2500000000% along"
          echo "$out" | tail -2 | sed -n 1p | q "PAGES line.* 36.2500000000% along"
          # Guided order: M cycles to it and - zooms out.
          $H --warp "$W" --press "M,M,-" --screenshot keys.png | tail -2 | sed -n 1p | q "PAGES line, guided zoom 57"
          # The address navigator: X opens the whole address, Home chooses its first digit, Up turns
          # it (carrying and wrapping), and ENTER goes there, far from where the walk started.
          # sieve-install, unattended: the fixture put back from its installer, identical; a second
          # time over it is refused (exit 1), as is a damaged installer.
          build/sieve locate tests/manifest_fixture --installer fx.sieve > /dev/null
          rm -rf fx_installed
          build/sieve-install fx.sieve --to fx_installed --yes --screenshot installer.bmp
          diff -r tests/manifest_fixture fx_installed
          test -s installer.bmp
          if build/sieve-install fx.sieve --to fx_installed --yes; then exit 1; fi
          head -c 100 fx.sieve > broken.sieve
          if build/sieve-install broken.sieve --to fx_broken --yes; then exit 1; fi
          test ! -e fx_broken
          # An installer carrying one 7z: sieve-install unpacks it into a folder named after the file,
          # its one top folder left out, so the fixture comes back as it was; the locator's own
          # install gives back the archive itself, byte for byte.
          build/sieve locate tests/manifest_fixture.7z --installer fx7.sieve > /dev/null
          rm -rf fx7 fx7raw
          build/sieve-install fx7.sieve --to fx7 --yes
          diff -r tests/manifest_fixture fx7
          build/sieve install fx7.sieve --to fx7raw > /dev/null
          cmp tests/manifest_fixture.7z fx7raw/manifest_fixture.7z
          # A release's layout: sieve and sieve-install in tools/ below the data folders. sieve there
          # finds the dictionaries and models in the folder above, and still makes installer
          # programs from the sieve-install beside it.
          rm -rf layout && mkdir -p layout/tools
          cp build/sieve build/sieve-install layout/tools/ && cp -r build/dictionaries build/models layout/
          (cd layout/tools && ./sieve dicts | grep -q "layout/dictionaries/dictionaries.tsv")
          (cd layout/tools && ./sieve models | grep -q "layout/models/models.tsv")
          layout/tools/sieve locate tests/manifest_fixture --program layout-installer > /dev/null
          rm -rf fx_layout && ./layout-installer --to fx_layout --yes && diff -r tests/manifest_fixture fx_layout
          # An installer program: sieve-install with the installer attached, run on its own, and
          # read by sieve install; exactly the program, the installer and a 24-byte trailer; and
          # made from a program that already has one attached, the old one replaced, not added to.
          build/sieve locate tests/manifest_fixture --program fx-installer > /dev/null
          rm -rf fx_prog fx_prog2
          ./fx-installer --to fx_prog --yes
          diff -r tests/manifest_fixture fx_prog
          build/sieve install fx-installer --to fx_prog2 > /dev/null
          diff -r tests/manifest_fixture fx_prog2
          # The File Locator's Install from an installer, in the hallway: the same folder again.
          rm -rf fx_gui
          $H --no-menu --install fx.sieve --install-to fx_gui --screenshot locinstall.png | q "saved locinstall.png"
          diff -r tests/manifest_fixture fx_gui
          test "$(wc -c < fx-installer)" = "$(( $(wc -c < build/sieve-install) + $(wc -c < fx.sieve) + 24 ))"
          rm -rf again && mkdir again && cp build/sieve again/ && cp fx-installer again/sieve-install
          again/sieve locate tests/manifest_fixture --program fx-again > /dev/null
          cmp fx-installer fx-again
          # The File Locator (pause menu): a folder measured, and a file walked to on the binary line.
          $H --no-menu --locate tests/manifest_fixture --screenshot locate.png | q "saved locate.png"
          $H --no-menu --binary-length 64 --locate tests/manifest_fixture/a.txt --press "Return" --screenshot locate2.png | tail -2 | sed -n 1p | tee l2.txt | q "^BINARY line"
          # Its kind, read from its first bytes.
          grep -q " TXT " l2.txt
          # The excluded mode: read back from the settings, and the excluded count is exactly the
          # line less the survivors (27^32 less clean-v2's survivors at length 32).
          printf "[text]\nmode = excluded\nfilters = clean-v2\n" > excluded.ini
          build/sieve filters --line text --length 32 --filters excluded.ini | q "^mode *excluded"
          build/sieve filters --line text --length 32 --filters excluded.ini | q "^excluded *247982505688110457657730525203966127924868733 "
          $H --no-menu --filters excluded.ini --goto 0% --press Escape --screenshot excluded.png | q "saved excluded.png"
          # The vault (docs/VAULT.md): its built-in test entry, the 16 bytes "sieve vault test", is
          # withheld as a file everywhere (located, mapped, installed by either installer) and
          # written out as text (as it is, or in any vault-decoders-v1 form, such as hex, base64 or
          # the a-p nibbles a lower27 line can hold), while text that is not a known file, however
          # close its words, is not. A vault file that cannot be read fails it closed.
          printf 'sieve vault test' > vt.txt
          build/sieve vault | q "3 built in"
          build/sieve vault | q "vault-decoders-v1"
          # Pictures, by PDQ: this cover's hash as Meta's own pdqhash (Pillow decoding) gives it, so
          # Sieve's reading of the reference code agrees bit for bit; then the test picture withheld
          # as it is, scaled, as an image unit, and base64'd, while an ordinary picture is not.
          build/sieve vault --pdq tests/example_book_cover.png | q "^cc661c39738cc4c68c713399cc63cc66739c1939cc66e3ce39391c71e3c6e38e  quality 56 "
          build/sieve vault --test-picture vtp.png > /dev/null
          build/sieve vault --test-picture vtp4.png --scale 4 > /dev/null
          if build/sieve vault vtp.png > /dev/null; then exit 1; fi
          if build/sieve vault vtp4.png > /dev/null; then exit 1; fi
          if build/sieve locate vtp4.png > /dev/null 2>&1; then exit 1; fi
          if build/sieve warp --line image --palette rgb24 --width 32 --height 32 --file vtp.png > /dev/null 2>&1; then exit 1; fi
          base64 vtp.png > vtp.b64
          if build/sieve vault --written vtp.b64 > /dev/null; then exit 1; fi
          build/sieve vault tests/example_book_cover.png | q "^clear"
          build/sieve warp --line image --palette rgb24 --width 32 --height 32 --file tests/example_book_cover.png | q "positional"
          if build/sieve vault vt.txt > /dev/null; then exit 1; fi
          if build/sieve locate vt.txt > /dev/null 2>&1; then exit 1; fi
          if build/sieve warp --line text --length 32 "sieve vault test" > /dev/null 2>&1; then exit 1; fi
          if build/sieve warp --line text --length 32 hdgjgfhggfcahggbhfgmhecahegfhdhe > /dev/null 2>&1; then exit 1; fi
          printf '73 69 65 76 65 20 76 61 75 6c 74 20 74 65 73 74\n' > vhex.txt
          printf 'c2lldmUgdmF1bHQgdGVzdA==' > vb64.txt
          if build/sieve vault --written vhex.txt > /dev/null; then exit 1; fi
          if build/sieve vault --written vb64.txt > /dev/null; then exit 1; fi
          build/sieve warp --line text --length 32 "sieve vault tests" | q "positional"
          build/sieve map --new vt --out vt.map 2> /dev/null
          if build/sieve map vt.map --add vt.txt --out vt.map > /dev/null 2>&1; then exit 1; fi
          python reference/sieve_ref.py manifest vt.txt --with-contents > vt.manifest
          python -c "b=open('vt.manifest','rb').read(); n=int.from_bytes(b,'big')+(256**len(b)-1)//255; open('vt.sieve','wb').write(n.to_bytes((n.bit_length()+7)//8,'big'))"
          rm -rf vti vti2
          if build/sieve install vt.sieve --to vti > /dev/null 2>&1; then exit 1; fi
          if build/sieve-install vt.sieve --to vti2 --yes; then exit 1; fi
          test ! -e vti && test ! -e vti2
          printf 'nonsense\n' > data/vault/broken.vault
          printf 'harmless' > vok.txt
          build/sieve vault | q "FAILED CLOSED"
          if build/sieve locate vok.txt > /dev/null 2>&1; then exit 1; fi
          rm data/vault/broken.vault
          build/sieve locate vok.txt | q "^sha256"
          # Pieces, by chunks (cdc-v1, chunk-match-v1): the built-in test file is listed by its chunks
          # only, so a 2.5 KB piece of it between other bytes is withheld, as a file, located, and
          # base64'd; a vault file written by --chunks lists another file the same way; and
          # --common leaves out chunks that ordinary files also hold.
          build/sieve vault | q "1 chunks: 13 chunks in all"
          build/sieve vault --test-file vtf.bin > /dev/null
          python -c "import base64; b=open('vtf.bin','rb').read(); open('vtf-piece.bin','wb').write(b'junk'+b[1000:3500]+b'junk'); open('vtf-piece.b64','w').write(base64.b64encode(b[500:3000]).decode())"
          if build/sieve vault vtf-piece.bin > /dev/null; then exit 1; fi
          if build/sieve locate vtf-piece.bin > /dev/null 2>&1; then exit 1; fi
          if build/sieve vault --written vtf-piece.b64 > /dev/null; then exit 1; fi
          python -c "import hashlib; open('listed.bin','wb').write(b''.join(hashlib.sha256(b'listed %d' % i).digest() for i in range(300)))"
          python -c "b=open('listed.bin','rb').read(); open('listed-piece.bin','wb').write(b[3000:6000])"
          build/sieve vault listed-piece.bin | q "^clear"
          build/sieve vault --chunks listed.bin > data/vault/listed.vault
          build/sieve vault --parse data/vault/listed.vault | q "1 chunks), well formed"
          if build/sieve vault listed-piece.bin > /dev/null; then exit 1; fi
          rm data/vault/listed.vault
          rm -rf ordinary && mkdir ordinary && cp listed-piece.bin ordinary/
          test "$(build/sieve vault --chunks listed.bin --common ordinary | tail -2 | head -1 | tr ',' '\n' | wc -l)" -lt "$(build/sieve vault --chunks listed.bin | tail -2 | head -1 | tr ',' '\n' | wc -l)"
          # Filter plugins that do not load are listed with the reason, never skipped: a malformed
          # file, and two different files under one name (neither is used: versions are never edited).
          printf 'sieve-filter-v1\nid broken\n' > build/filters/broken.sfilter
          sed 's/^describe.*/describe edited/' data/filters/clean-data-v1.sfilter > build/filters/clean-edited.sfilter
          build/sieve filters --plugins > plugins.out
          grep -A1 "broken.sfilter" plugins.out | q "ends with end"
          grep -A1 "clean-edited.sfilter" plugins.out | q "with different contents"
          if build/sieve filters --length 8 | grep -q "clean-data-v1"; then exit 1; fi
          rm build/filters/broken.sfilter build/filters/clean-edited.sfilter
          build/sieve filters --length 8 | q "clean-data-v1"
          # `requires`: ticking tidy-data-v1 alone brings clean-data-v1 and max-run-data-v1 (at the
          # max it pins) into the stack, which still counts; a different setting is flagged; and a
          # copy of a plugin under another name is found to be the same rule.
          printf "[text]\nmode = compact\nfilters = tidy-data-v1\n" > tidy.ini
          build/sieve filters --length 12 --filters tidy.ini | q "max-run-data-v1{plugin sha256=[0-9a-f]* max=3}; clean-data-v1"
          build/sieve filters --length 12 --filters tidy.ini | q "compact mode available"
          printf "[text]\nfilters = tidy-data-v1, max-run-data-v1\n[text.max-run-data-v1]\nmax = 5\n" > tidy5.ini
          build/sieve filters --length 12 --filters tidy5.ini | q "requires max-run-data-v1 at max=3; it is set to max=5"
          sed 's/^id        clean-data/id        clean-copy/' data/filters/clean-data-v1.sfilter > clean-copy.sfilter
          build/sieve filters --plugin clean-copy.sfilter --relations | q "the same rule as clean-data-v1  -- a duplicate"
          # The filter designer (main menu): it opens a plugin and writes it back as it would save
          # it, the same rule (a round trip); a word filter made and saved by script is registered
          # at once and named a duplicate of words-data-v1; saving other contents under that
          # version offers the next one instead (versions are never edited).
          $H --designer --screenshot designer.png | q "designer: my-words-v1"
          $H --designer --busy --screenshot designer-busy.png | q "designer: my-words-v1"
          # Opening the designer compiles nothing: only F5 (TEST NOW), Save or the relation check do.
          test "$($H --designer --timings --screenshot designer-idle.png 2>&1 | grep -c '^designer.test ')" = 0
          $H --designer --design tests/plugins/toy-grammar-v1.sfilter --design-out tests/plugins/roundtrip-v1.sfilter --screenshot designer2.png | q "designer: toy-grammar-v1"
          build/sieve filters --plugin tests/plugins/toy-grammar-v1.sfilter --length 11 | grep -v "^sha256" > rt.a
          build/sieve filters --plugin tests/plugins/roundtrip-v1.sfilter --length 11 | grep -v "^sha256" > rt.b
          diff rt.a rt.b
          rm tests/plugins/roundtrip-v1.sfilter
          rm -f build/filters/designed-words-v*.sfilter
          $H --designer --script "Ctrl+N,Down,Return,Ctrl+Backspace,=designed-words,Return,Ctrl+S" --screenshot designer3.png | q "status: saved to .*designed-words-v1.sfilter"
          build/sieve filters --plugins | q "^loaded   designed-words-v1"
          build/sieve filters --plugin build/filters/designed-words-v1.sfilter --length 6 --relations | q "the same rule as words-data-v1  -- a duplicate"
          $H --designer --design build/filters/designed-words-v1.sfilter --script "Down,Down,Down,Down,Down,Down,Down,Return,=!,Return,Ctrl+S" --screenshot designer4.png | q "save as version 2"
          rm build/filters/designed-words-v1.sfilter
          # --timings: the table at exit, on the command line and from the hallway (to its file too).
          build/sieve warp --line text --length 32 --timings "timed" 2>&1 | q "^sieve warp "
          $H --no-menu --timings --settings timed.ini --screenshot timed.png 2>&1 | q "^hallway.item "
          grep -q "^hallway.build " sieve-timings.txt
          # F on the item page saves the item in hand (here without its dialog): a page of the text
          # line as text, and a file of the binary line as exactly its bytes.
          rm -f saved_page.txt saved_file.bin
          $H --no-menu --pose 0.8,3.12,-90,-5 --take --save-item saved_page --screenshot savepage.png | q "saved savepage.png"
          test -s saved_page.txt
          $H --no-menu --line binary --binary-length 64 --pose 0.8,3.12,-90,-5 --take --save-item saved_file.bin --screenshot savefile.png | q "saved savefile.png"
          test "$(wc -c < saved_file.bin)" -gt 0
          # Past the budget: a 100 KB file, twice the BINARY length, is still reached by pressing
          # Go to it twice; the line is made long enough, positional, and only the room is kept.
          head -c 100000 /dev/urandom > big.bin
          $H --no-menu --binary-length 1000 --locate big.bin --press "Return,Return" --screenshot big.png | tail -2 | sed -n 1p | q "^BINARY line, positional"
          # The node graph (O, and the pause menu's third row): the fixture's map, laid out; Tab to
          # its third node (a.txt) and Enter walk to it on the binary line; and the item page's
          # SORT tab knows a.txt for a verified anchor of that map, and anything else for a lone point.
          $H --no-menu --map tests/manifest_fixture --graph --screenshot graph.png | q "saved graph.png"
          $H --no-menu --binary-length 64 --map tests/manifest_fixture --graph --press "Tab,Tab,Tab,Return" --screenshot graph2.png | tail -2 | sed -n 1p | q "^BINARY line.* TXT 34 bytes"
          $H --no-menu --binary-length 64 --map tests/manifest_fixture --locate tests/manifest_fixture/a.txt --press "Return,C,C" --screenshot sort.png | tail -2 | sed -n 1p | q "a verified anchor: node 2, a.txt, in manifest_fixture"
          $H --no-menu --line binary --map tests/manifest_fixture --walk "0,0" --press "E,C,C" --screenshot sort2.png | tail -2 | sed -n 1p > sort2.txt
          if grep -q "verified anchor" sort2.txt; then exit 1; fi
          # (--warp starts with the item in your hands: the first Escape puts it down, the second pauses.)
          $H --warp "$W" --press "Escape,Escape,Down,Down,Return" --screenshot pausegraph.png | q "saved pausegraph.png"
          $H --no-menu --graph --screenshot installation.png | q "saved installation.png"
          # Verified anchors: New map... makes an empty map; V adds the file in hand to it, held
          # (its bytes kept in the map), and V again takes it out; with metadata, the item page
          # gains a META tab; a held anchor can be walked to from the viewer, whose Delete removes
          # it; a sealed map will not take one.
          rm -f build/maps/finds.map
          $H --no-menu --binary-length 64 --new-map build/maps/finds.map --locate tests/manifest_fixture/a.txt --press "Return,V" --screenshot anchor.png | q "added a.txt to finds as a verified anchor (node 1)"
          build/sieve map build/maps/finds.map 2>&1 | q "1 held"
          $H --no-menu --binary-length 64 --map build/maps/finds.map --locate tests/manifest_fixture/a.txt --press "Return,V" --screenshot anchor2.png | q "removed a.txt from finds"
          build/sieve map build/maps/finds.map 2>&1 | q "0 held"
          build/sieve map build/maps/finds.map --add tests/manifest_fixture/a.txt --out build/maps/finds.map 2> /dev/null
          build/sieve map build/maps/finds.map --meta "1:source=the fixture folder" --out build/maps/finds.map 2> /dev/null
          $H --no-menu --binary-length 64 --map build/maps/finds.map --locate tests/manifest_fixture/a.txt --press "Return,C,C,C" --screenshot meta.png | q "saved meta.png"
          $H --no-menu --binary-length 64 --map build/maps/finds.map --graph --press "Tab,Tab,Return" --screenshot anchorgo.png | tail -2 | sed -n 1p | q "^BINARY line.* TXT 34 bytes"
          $H --no-menu --map build/maps/finds.map --graph --press "Tab,Tab,Delete" --screenshot anchordel.png | q "saved anchordel.png"
          build/sieve map build/maps/finds.map 2>&1 | q "0 held"
          rm -f build/maps/finds.map
          build/sieve map --new sealed --seal --out build/maps/sealed.map 2> /dev/null
          $H --no-menu --binary-length 64 --map build/maps/sealed.map --locate tests/manifest_fixture/a.txt --press "Return,V" --screenshot sealed.png | q "sealed is read-only"
          rm -f build/maps/sealed.map
          # The pause menu (Esc): its fourth row is the Navigation System, which opens the navigator.
          $H --warp "$W" --press "Escape,Escape,Down,Down,Down,Return,Escape" --screenshot pause.png | q "saved pause.png"
          # The Media Player (pause menu, sixth row): with --media-player a silent music player is
          # made for the picture; its settings file goes where --settings says, not beside the program.
          mkdir -p mp
          $H --no-menu --media-player --settings mp/hallway.ini --press "Escape,Down,Down,Down,Down,Down,Return" --screenshot media.png | q "saved media.png"
          out=$($H --warp "$W" --press "X,Home,Up,Return" --screenshot nav.png)
          echo "$out" | tail -2 | sed -n 1p | q "went to 1"
          if [ "$(echo "$out" | tail -2 | book)" = "$here" ]; then exit 1; fi
          # The navigator's bearing field: Tab, a bearing, ENTER, and you stand at that angle round
          # the loop (180 degrees is exactly halfway); a bearing of 360 or more is refused.
          $H --warp "$W" --press "X,Tab,1,8,0,Return" --screenshot navangle.png | tail -2 | sed -n 1p | q "50.0000000000% along"
          if $H --warp "$W" --press "X,Tab,3,6,0,Return" --screenshot navangle2.png | tail -2 | sed -n 1p | grep -q "went to"; then exit 1; fi
          start=$($H --mode guided --warp "$W" --zoom 20 --walk "0,0" --screenshot start.png | book)
          # The corridor end to end and back: six doors left from pages reach binary, which is
          # where the run finishes, and six right brings you back to the same book on pages.
          out=$($H --mode guided --warp "$W" --zoom 20 --pose 0,7,-90,0 --walk "-2.3,0;-4.2,0;-4.2,0;-4.2,0;-4.2,0;-4.2,0;4.2,0;4.2,0;4.2,0;4.2,0;4.2,0;4.2,0" --screenshot guided.png)
          echo "$out"
          echo "$out" | q "VIDEO line"
          echo "$out" | q "BOOKS line"
          echo "$out" | q "MODELS line"
          echo "$out" | q "BINARY line"
          echo "$out" | sed -n 6p | q "^BINARY line"
          echo "$out" | tail -2 | sed -n 1p | q "^PAGES line"
          test "$(echo "$out" | tail -2 | book)" = "$start"
          # Loops: a 2-character line is 729 units = 6 tiles, so tile 6 starts the second copy,
          # and the CLI reads the same corridor places the hallway shows. The CLI's lines are bare,
          # and a title length of 0 makes the hallway's the same.
          $H --length 2 --title-length 0 --goto @6 --walk "0,0" --screenshot loop6.png | q "first book 000 "
          test "$(build/sieve read --length 2 --mode positional --at 6:0 2>/dev/null)" = "  "
          test "$(build/sieve read --length 2 --mode positional --at -1:127 2>/dev/null)" = "(empty: padding at the end of a loop)"
          build/sieve info --length 2 | q "39 empty slots"
          build/sieve info --line image | q "fills whole tiles exactly"
          # The setup menu renders at ordinary and enormous sizes, and scripted keys reach it.
          $H --menu --screenshot menu.png | q "saved menu.png"
          $H --menu --press "Down,Down,Down,Right,PageUp" --screenshot menu2.png | q "saved menu2.png"
          $H --menu --length 4000000000 --video-width 100000 --video-frames 100000 --screenshot menu3.png | q "saved menu3.png"
          test -s menu.png && test -s menu2.png && test -s menu3.png
          # Books: the fifth line. Its books are a cover, a title and pages; the committed example
          # book opens on its shelf when the lines have its shape, and page N turns.
          $H --line books --walk "0,0" --screenshot books.png | sed -n 1p | q "BOOKS line, positional, filters: none"
          out=$($H --line books --length 400 --book-pages 3 --warp tests/example_book_v1.book --walk "0,0" --press N --screenshot book-open.png)
          echo "$out"
          echo "$out" | sed -n 1p | q '"a tale of two cities'
          echo "$out" | q "opened the book"
          $H --line books --warp tests/example_book_v1.book --walk "0,0" --screenshot book-wrong.png | sed -n 1p | q "in the menu to the book's shape"
          $H --line books --mode scrambled --walk "0,0" --take --screenshot book-hand.png | sed -n 1p | q "BOOKS line, scrambled"
          printf '[books]\nmode = compact\n[books.title]\nfilters = title-v1\n[books.pages]\nfilters = words-v2\n' > books.ini
          $H --filters books.ini --line books --length 400 --book-pages 3 --warp tests/example_book_v1.book --walk "0,0" --screenshot book-compact.png | sed -n 1p | q "surviving books"
          $H --filters books.ini --line books --length 400 --book-pages 3 --mode scrambled --walk "0,0" --take --screenshot book-compact2.png | sed -n 1p | q "BOOKS line, scrambled, filters: 0+1+1 compact"
          $H --menu --screenshot menu5.png | q "saved menu5.png"
          # The main menu, its settings screens and a language file with gaps (English fills them).
