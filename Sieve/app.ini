; Sieve hallway settings, edited by the main menu's Settings (hand edits are welcome).

[graphics]
resolution = 1280x720
fullscreen = off
vsync = off   ; off: frames as fast as they can be drawn (may tear)
edge_glow = off       ; Geometry Edge Glow
real_graphics = on   ; Real Graphics (only one of the two is on)
door_portals = on    ; Door Portals: procedural data noise in the doorways
model_cache_mb = 64   ; the models line: memory for rendered crate faces
fps_counter = off

[controls]
mouse_sensitivity = 100   ; percent
invert_mouse_y = off

[language]
language = en
