; Sieve's reference filter settings for the metrics list (IDEAS §19.12): what make_release counts
; for metrics.txt, beside the installer, so that releases can be compared one with another. Its
; SHA-256 heads the list: change this file and the figures change with it, on the record.
;
; It ticks, on every line, the hard filters that count together: those that set aside only noise
; (structure and exclusion: no dictionary, no model, no taste), so the figures say what Sieve
; removes before any choice is made. Soft filters are your own (sieve-filters.ini); the hallway
; writes your own list with: hallway --metrics my-metrics.txt --filters sieve-filters.ini

[text]
mode = mark
filters = max-run-v1, not-written-v1, not-other-line-v1

[image]
mode = mark
filters = not-packed-v1

[audio]
mode = mark
filters = not-a-pattern-v1

[video]
mode = mark
filters = not-packed-v1

[books]
mode = mark
[books.cover]
filters = not-packed-v1
[books.title]
filters = max-run-v1, not-written-v1
[books.pages]
filters = max-run-v1, not-written-v1

[tracks]
mode = mark
[tracks.cover]
filters = not-packed-v1
[tracks.title]
filters = max-run-v1, not-written-v1
[tracks.units]
filters = not-a-pattern-v1

[movies]
mode = mark
[movies.cover]
filters = not-packed-v1
[movies.title]
filters = max-run-v1, not-written-v1
[movies.units]
filters = not-packed-v1

[models]
mode = mark
filters = distinct-vertices-v1, distinct-indices-v1, canonical-mesh-v1

[worlds]
mode = mark
[worlds.cover]
filters = not-packed-v1
[worlds.title]
filters = max-run-v1, not-written-v1
[worlds.models]
filters = distinct-vertices-v1, distinct-indices-v1, canonical-mesh-v1

[binary]
mode = mark
filters = binary-kind-v1

[ai]
mode = mark
filters = canonical-model-v1
