; Where the pre-rendered picture goes on each line's item, in the item model's own metres:
; the front faces the corridor in the x = 0 plane, y is up from the shelf board, and the
; picture is centred across the slot, half_width either side. A line whose items vary in
; height (image, pages, books) stretches it as the model is stretched, by the slot's height
; over 0.40 m; every line shrinks it with the shelf at 256 items a tile. Change a model and
; measure its front again: a missing line or value here means the whole 0.28 x 0.40 m slot.

; One section per line, in door order. Tracks and movies began as copies of audio and video, worlds
; and AI as copies of models. AI's is ready for the AI dimension, which is not built yet.

